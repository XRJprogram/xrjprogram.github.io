    <script>
        /* 星空粒子画布系统 */
        (function initCosmos() {
            const canvas = document.getElementById('cosmos-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w, h;
            const stars = [];
            const count = 180;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.7 + 0.3,
                    speed: Math.random() * 0.015 + 0.005
                });
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);
                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    s.alpha += s.speed;
                    if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, Math.min(1, s.alpha))})`;
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

        /* 卡片渲染与在线模态浮层 */
        (function initExhibition() {
            const grid = document.getElementById('exhibitionGrid');
            const modal = document.getElementById('worksModal');
            const modalTitle = document.getElementById('worksModalTitle');
            const modalYear = document.getElementById('worksModalYear');
            const modalIframe = document.getElementById('worksModalIframe');
            const modalClose = document.getElementById('worksModalClose');
            const modalNewTab = document.getElementById('worksModalNewTab');
            const modalFs = document.getElementById('worksModalFs');

            if (!grid) return;

            function renderCards() {
                grid.innerHTML = '';
                EXHIBITION_WORKS.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'ex-artifact-card';
                    card.style.setProperty('--card-accent', item.accent);
                    card.style.setProperty('--card-rgb', item.rgb);
                    card.setAttribute('tabindex', '0');
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-label', `体验 ${item.titleCn} · ${item.titleEn}`);
                    card.innerHTML = `
                        <div class="ex-card-top">
                            <div class="ex-card-meta-left">
                                <span class="ex-pulse-dot"></span>
                                <span class="ex-code-badge">[ ${item.code} ]</span>
                            </div>
                            <span class="ex-tag-tech">[ ${item.highlight} ]</span>
                        </div>
                        <div class="ex-card-body">
                            <div class="ex-title-wrap">
                                <h3 class="ex-title-cn">${item.titleCn}</h3>
                                <span class="ex-title-en">${item.titleEn}</span>
                            </div>
                            <p class="ex-card-desc">${item.desc}</p>
                        </div>
                        <div class="ex-card-foot">
                            <div class="ex-foot-spec">
                                <span class="ex-spec-chip">${item.runtime}</span>
                            </div>
                            <div class="ex-foot-formula">
                                <span class="ex-formula-text">${item.formula}</span>
                            </div>
                        </div>
                    `;

                    card.addEventListener('click', () => {
                        openModal(item);
                    });

                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            openModal(item);
                        }
                    });

                    grid.appendChild(card);
                });
            }

            function openModal(item) {
                if (!modal) return;
                modalTitle.textContent = `${item.titleCn} · ${item.titleEn}`;
                modalYear.textContent = item.year;
                modalYear.style.backgroundColor = item.accent;
                modalYear.style.color = '#ffffff';
                modalNewTab.href = item.url;
                modalIframe.src = item.url;

                modal.classList.add('active');
                modal.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                if (!modal) return;
                modal.classList.remove('active');
                modal.setAttribute('aria-hidden', 'true');
                modalIframe.src = 'about:blank';
                document.body.style.overflow = '';
            }

            if (modalClose) modalClose.addEventListener('click', closeModal);
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal();
                });
            }
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal && modal.classList.contains('active')) {
                    closeModal();
                }
            });

            if (modalFs && modalIframe) {
                modalFs.addEventListener('click', () => {
                    if (modalIframe.requestFullscreen) {
                        modalIframe.requestFullscreen();
                    } else if (modalIframe.webkitRequestFullscreen) {
                        modalIframe.webkitRequestFullscreen();
                    }
                });
            }

            renderCards();
        })();
    </script>
