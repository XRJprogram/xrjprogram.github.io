    <text x="960" y="10" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="1">ARCHIVE #02 / 12</text>
  </g>

  <!-- Center Graphic Diagram -->
  
      <g transform="translate(541, 280)">
        <circle cx="0" cy="0" r="140" fill="none" stroke="#0891b2" stroke-width="2" />
        <circle cx="0" cy="0" r="120" fill="none" stroke="#155e75" stroke-width="1" stroke-dasharray="6 6" />
