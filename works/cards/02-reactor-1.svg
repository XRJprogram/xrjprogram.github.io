  <rect x="24" y="24" width="1034" height="588" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="30" y="30" width="1022" height="576" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>

