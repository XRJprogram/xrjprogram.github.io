        <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
        <g fill="#0e7490" stroke="#22d3ee" stroke-width="1.5">
          <circle cx="0" cy="-60" r="14" /><circle cx="52" cy="-30" r="14" /><circle cx="52" cy="30" r="14" />
          <circle cx="0" cy="60" r="14" /><circle cx="-52" cy="30" r="14" /><circle cx="-52" cy="-30" r="14" />
          <circle cx="0" cy="0" r="22" fill="#06b6d4" stroke="#cffafe" stroke-width="2" />
        </g>
        <path d="M-130 0 L-100 0 M100 0 L130 0 M0 -130 L0 -100 M0 100 L0 130" stroke="#22d3ee" stroke-width="2"/>
        <text x="0" y="5" font-family="monospace" font-size="11" fill="#042f2e" font-weight="bold" text-anchor="middle">CRIT</text>
