    <text x="220" y="10" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#eab308" letter-spacing="3">[ PROCEDURAL STORY TREE SANDBOX ]</text>
    <text x="960" y="10" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="1">ARCHIVE #11 / 12</text>
  </g>

  <!-- Center Graphic Diagram -->
  
      <g transform="translate(541, 280)">
        <!-- Decision Tree Branches -->
        <circle cx="-120" cy="0" r="16" fill="#854d0e" stroke="#facc15" stroke-width="2"/>
        <path d="M -104 0 L -30 -60 M -104 0 L -30 60" stroke="#fef08a" stroke-width="2"/>
        <circle cx="-30" cy="-60" r="12" fill="#a16207" stroke="#fde047" stroke-width="1.5"/>
        <circle cx="-30" cy="60" r="12" fill="#a16207" stroke="#fde047" stroke-width="1.5"/>
        <path d="M -18 -60 L 50 -90 M -18 -60 L 50 -30 M -18 60 L 50 30 M -18 60 L 50 90" stroke="#ca8a04" stroke-width="2"/>
        <circle cx="50" cy="-90" r="8" fill="#eab308"/><circle cx="50" cy="-30" r="8" fill="#eab308"/>
        <circle cx="50" cy="30" r="8" fill="#eab308"/><circle cx="50" cy="90" r="8" fill="#eab308"/>
        <path d="M 58 -90 L 120 -60 M 58 90 L 120 60" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4 3"/>
        <circle cx="120" cy="-60" r="14" fill="#ca8a04" stroke="#fff" stroke-width="2"/>
        <circle cx="120" cy="60" r="14" fill="#ca8a04" stroke="#fff" stroke-width="2"/>
      </g>
    

  <!-- Bottom Technical Blueprint Strip -->
