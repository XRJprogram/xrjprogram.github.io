<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1082 636" width="1082" height="636">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cardGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>

  <!-- Deep Obsidian Slate Background -->
  <rect width="1082" height="636" fill="#071326"/>
  <!-- Technical Grid Pattern -->
  <rect width="1082" height="636" fill="url(#cardGrid)"/>

  <!-- Outer Architectural Border -->
  <rect x="24" y="24" width="1034" height="588" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="30" y="30" width="1022" height="576" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Precision Corner Crosshairs -->
  <g stroke="#818cf8" stroke-width="2" opacity="0.8">
    <path d="M 20 24 L 36 24 M 24 20 L 24 36"/>
    <path d="M 1046 24 L 1062 24 M 1058 20 L 1058 36"/>
    <path d="M 20 612 L 36 612 M 24 600 L 24 616"/>
    <path d="M 1046 612 L 1062 612 M 1058 600 L 1058 616"/>
  </g>

  <!-- Top Metadata Bar -->
  <g transform="translate(56, 70)">
    <circle cx="6" cy="6" r="5" fill="#818cf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="10" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="2">[ 2023 · 04 ]</text>
    <text x="220" y="10" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#818cf8" letter-spacing="3">[ BYTECODE ASSEMBLY PIPELINE ]</text>
    <text x="960" y="10" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="1">ARCHIVE #04 / 12</text>
  </g>

  <!-- Center Graphic Diagram -->
  
      <g transform="translate(541, 280)">
        <!-- INBOX Queue -->
        <rect x="-180" y="-50" width="60" height="100" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" rx="4" />
        <text x="-150" y="-20" font-family="monospace" font-size="11" fill="#c7d2fe" text-anchor="middle">INBOX</text>
        <rect x="-170" y="0" width="40" height="20" fill="#4338ca" rx="2" />
        <text x="-150" y="14" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">42</text>
        <!-- CPU / Accumulator -->
        <circle cx="0" cy="0" r="50" fill="#312e81" stroke="#a5b4fc" stroke-width="2" />
        <text x="0" y="-10" font-family="monospace" font-size="11" fill="#e0e7ff" text-anchor="middle">ACC</text>
        <text x="0" y="14" font-family="monospace" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">[ 42 ]</text>
        <!-- OUTBOX Queue -->
        <rect x="120" y="-50" width="60" height="100" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" rx="4" />
        <text x="150" y="-20" font-family="monospace" font-size="11" fill="#c7d2fe" text-anchor="middle">OUT</text>
        <rect x="130" y="0" width="40" height="20" fill="#4338ca" rx="2" />
        <text x="150" y="14" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">42</text>
        <!-- Dataflow Arrows -->
        <path d="M-110 0 L-60 0" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" />
        <path d="M60 0 L110 0" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" />
      </g>
    

  <!-- Bottom Technical Blueprint Strip -->
  <g transform="translate(56, 480)">
    <line x1="0" y1="0" x2="970" y2="0" stroke="#1e293b" stroke-width="1.5"/>
    
    <text x="0" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1.5">HUMAN RESOURCE MACHINE</text>
    <text x="0" y="78" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="1">微指令集汇编 · 算法调度沙盒</text>

    <!-- Formula Chip -->
    <g transform="translate(970, 48)" text-anchor="end">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#818cf8" letter-spacing="1">INBOX → [ACC] → OUTBOX</text>
      <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="2">TURBOWARP · 60FPS COMPILATION</text>
    </g>
  </g>
</svg>