<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1082 636" width="1082" height="636">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cardGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Deep Obsidian Slate Background -->
  <rect width="1082" height="636" fill="#071326"/>
  <!-- Technical Grid Pattern -->
  <rect width="1082" height="636" fill="url(#cardGrid)"/>

  <!-- Outer Architectural Border -->
  <rect x="24" y="24" width="1034" height="588" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="30" y="30" width="1022" height="576" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Precision Corner Crosshairs -->
  <g stroke="#0284c7" stroke-width="2" opacity="0.8">
    <path d="M 20 24 L 36 24 M 24 20 L 24 36"/>
    <path d="M 1046 24 L 1062 24 M 1058 20 L 1058 36"/>
    <path d="M 20 612 L 36 612 M 24 600 L 24 616"/>
    <path d="M 1046 612 L 1062 612 M 1058 600 L 1058 616"/>
  </g>

  <!-- Top Metadata Bar -->
  <g transform="translate(56, 70)">
    <circle cx="6" cy="6" r="5" fill="#0284c7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="10" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="2">[ 2025 · 12 ]</text>
    <text x="220" y="10" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#0284c7" letter-spacing="3">[ TOPOLOGICAL TRANSIT INTERLOCK ]</text>
    <text x="960" y="10" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="1">ARCHIVE #12 / 12</text>
  </g>

  <!-- Center Graphic Diagram -->
  
      <g transform="translate(541, 280)">
        <!-- Metro Lines -->
        <line x1="-150" y1="-40" x2="150" y2="-40" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
        <line x1="-150" y1="40" x2="150" y2="40" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
        <path d="M-60 -40 L0 0 L60 40" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
        <!-- Stations / Interchanges -->
        <circle cx="-100" cy="-40" r="7" fill="#fff" stroke="#0284c7" stroke-width="3"/>
        <circle cx="0" cy="0" r="10" fill="#fff" stroke="#1e293b" stroke-width="3"/>
        <circle cx="100" cy="-40" r="7" fill="#fff" stroke="#0284c7" stroke-width="3"/>
        <circle cx="-100" cy="40" r="7" fill="#fff" stroke="#059669" stroke-width="3"/>
        <circle cx="100" cy="40" r="7" fill="#fff" stroke="#059669" stroke-width="3"/>
        <!-- Signal Lights -->
        <circle cx="-40" cy="-60" r="5" fill="#22c55e"/>
        <circle cx="40" cy="-60" r="5" fill="#ef4444"/>
      </g>
    

  <!-- Bottom Technical Blueprint Strip -->
  <g transform="translate(56, 480)">
    <line x1="0" y1="0" x2="970" y2="0" stroke="#1e293b" stroke-width="1.5"/>
    
    <text x="0" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1.5">SUBWAY DISPLAYER</text>
    <text x="0" y="78" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="1">城市轨道交通 · 闭塞区间与联锁调度看板</text>

    <!-- Formula Chip -->
    <g transform="translate(970, 48)" text-anchor="end">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#0284c7" letter-spacing="1">G = (V, E) · SIGNAL_BLOCK</text>
      <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="2">TURBOWARP · 60FPS COMPILATION</text>
    </g>
  </g>
</svg>