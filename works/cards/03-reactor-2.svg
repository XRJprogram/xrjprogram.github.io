    </circle>
    <text x="24" y="10" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="2">[ 2022 · 03 ]</text>
    <text x="220" y="10" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#3b82f6" letter-spacing="3">[ THERMOHYDRAULIC SCRAM SYSTEM ]</text>
    <text x="960" y="10" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="1">ARCHIVE #03 / 12</text>
  </g>

  <!-- Center Graphic Diagram -->
  
      <g transform="translate(541, 280)">
        <!-- Primary Loop -->
        <rect x="-140" y="-80" width="90" height="160" rx="45" fill="none" stroke="#3b82f6" stroke-width="2" />
        <rect x="50" y="-80" width="90" height="160" rx="45" fill="none" stroke="#60a5fa" stroke-width="2" />
        <!-- Cross Piping -->
        <path d="M -95 -50 C -30 -90, 30 -90, 95 -50" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 4" />
        <path d="M 95 50 C 30 90, -30 90, -95 50" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="8 4" />
        <!-- Heat Exchanger Grids -->
        <line x1="-120" y1="-20" x2="-70" y2="-20" stroke="#38bdf8" stroke-width="2"/>
        <line x1="-120" y1="0" x2="-70" y2="0" stroke="#38bdf8" stroke-width="2"/>
        <line x1="-120" y1="20" x2="-70" y2="20" stroke="#38bdf8" stroke-width="2"/>
        <circle cx="95" cy="0" r="28" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2" />
        <text x="95" y="4" font-family="monospace" font-size="10" fill="#bfdbfe" text-anchor="middle">TURBINE</text>
      </g>
    

  <!-- Bottom Technical Blueprint Strip -->
  <g transform="translate(56, 480)">
    <line x1="0" y1="0" x2="970" y2="0" stroke="#1e293b" stroke-width="1.5"/>
    
    <text x="0" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1.5">REACTOR II</text>
