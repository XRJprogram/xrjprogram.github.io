<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRJprogram · 个人项目矩阵与作品展</title>
    <meta name="description" content="XRJprogram 个人主页与技术作品展：AnyChem Pro 分子动力学模拟、BitPulse 8-Bit 音乐发生器、Chemiation 化学反应演示、PixelMe 像素角色捏脸、littlesc Scratch 积木代码生成、Gif Editor QQ 表情衍生工坊、Lambda Diagrams 极简图示工作台，以及 FantasyCity 幻想城。">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/fumo-icon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="assets/images/fumo-icon.png">
    
    <!-- Asynchronous Google Fonts (non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cinzel:wght@700;900&family=Space+Grotesk:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Press+Start+2P&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cinzel:wght@700;900&family=Space+Grotesk:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Press+Start+2P&display=swap"></noscript>

    <style>
        /* ============================================================
           设计规范：专属色彩体系与完备中文字体回退矩阵 (兼顾在线与离线环境)
           ============================================================ */
        :root {
            --bg-cosmos: #030611;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.45);

            /* Anychem-pro 真实源码色相：鼠尾草绿、深灰玄武岩 */
            --anychem-accent: #9fb48d;
            --anychem-bg: #090c0e;
            --anychem-surface: #10161a;

            /* BitPulse 真实源码色相：NES 2A03 示波器荧光绿、碳晶黑 */
            --bitpulse-green: #10b981;
            --bitpulse-mint: #34d399;
            --bitpulse-dark: #09090b;

            /* Chemiation 真实源码色相：深棕学术质感、反应活性赭红、能量跃迁金 */
            --chemiation-ochre: #b84a28;
            --chemiation-gold: #c08a3e;
            --chemiation-dark: #140b06;

            /* PixelMe 真实源码色相：鸢尾花紫、赛博青、高光粉、复古明黄 */
            --pixelme-iris: #6c5ce7;
            --pixelme-cyan: #00cec9;
            --pixelme-pink: #fd79a8;
            --pixelme-yellow: #ffeaa7;
            --pixelme-dark: #120e24;

            /* littlesc 真实源码色相：Scratch 3.0 事件橙、引擎蓝、Diff 翠绿 */
            --littlesc-orange: #ffab19;
            --littlesc-blue: #4c97ff;
            --littlesc-diff: #0fbd8c;
            --littlesc-dark: #16161a;

            /* GifEditor 真实源码色相：UE5 Slate 蓝图青、节点金、暗夜 Slate */
            --gifeditor-cyan: #38bdf8;
            --gifeditor-amber: #f59e0b;
            --gifeditor-glow: rgba(56, 189, 248, 0.4);
            --gifeditor-dark: #070d18;

            /* LambdaDiagrams 真实源码色相：纯黑白极简主义、高对比度电路拓扑 */
            --lambda-bg: #000000;
            --lambda-white: #ffffff;
            --lambda-muted: #888888;
            --lambda-border: rgba(255, 255, 255, 0.4);
            --lambda-glow: rgba(255, 255, 255, 0.18);

            /* 东方宣纸淡黄色底蕴与朱砂印泥 */
            --paper-pale-yellow: #faf6e9;
            --fc-seal: #c0392b;
            --fc-gold: #a67c1e;
            --fc-dark-ink: #1a110b;

            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-cinema: 'Cinzel', 'Noto Serif SC', 'Songti SC', 'STSong', '华文宋体', 'SimSun', '宋体', serif;
            --font-display: 'Space Grotesk', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Consolas', monospace;
            --font-calligraphy: 'Ma Shan Zheng', 'STXingkai', '华文行楷', 'FZXingKai-S04S', 'STKaiti', '华文楷体', 'KaiTi', '楷体', 'SimSun', '宋体', cursive, serif;
            --font-song: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', '华文宋体', 'SimSun', '宋体', serif;
            --font-sans-cn: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', 'SimHei', '黑体', sans-serif;
            --font-pixel: 'Press Start 2P', monospace;

            --radius-pill: 9999px;
            --transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            font-family: var(--font-sans-cn);
            background-color: var(--bg-cosmos);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* 星空背景 Canvas */
        #cosmos-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.92;
        }

        /* ============================================================
           页眉：固定悬浮顶栏（左侧 XRJPROGRAM，右侧 GitHub）
           纯 fixed 悬浮，不占垂直文档流空间，绝不挤压卡片！
           向下滑动时文字颜色平滑过渡为墨色，确保在淡黄色宣纸上清晰醒目
           ============================================================ */
        .floating-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 24px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }
        .nav-brand {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 0.18em;
            text-decoration: none;
            color: #ffffff;
            pointer-events: auto;
            transition: transform 0.3s ease;
        }
        .nav-brand:hover {
            transform: scale(1.03);
        }
        .nav-github {
            font-size: 1.3rem;
            color: #94a3b8;
            text-decoration: none;
            pointer-events: auto;
            transition: transform 0.3s ease, color 0.3s ease;
            display: flex;
            align-items: center;
        }
        .nav-github:hover {
            color: #fff;
            transform: scale(1.1);
        }

        /* ============================================================
           首屏：完全消除卡片上方的一切标题与占位！
           整屏 100vh 垂直居中铺满视口，打开网页第一眼直接沉浸进入 3D 卡牌空间
           ============================================================ */
        .first-screen-hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 0 24px;
        }

        .spatial-deck-stage {
            position: relative;
            width: 100%;
            height: 460px;
            margin-bottom: 30px;
            perspective: 1600px;
            perspective-origin: 50% 50%;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }
        .spatial-deck-stage:active {
            cursor: grabbing;
        }

        /* 16:9 电影海报卡牌基础容器 (660px × 372px) */
        .poster-artifact-card {
            position: absolute;
            width: 660px;
            height: 372px;
            border-radius: 20px;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            will-change: transform, opacity;
            box-shadow: 0 16px 36px -12px rgba(0, 0, 0, 0.75);
            transition: box-shadow 0.4s ease, border-color 0.4s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 36px 42px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .poster-top-row {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
        }

        .poster-center-body {
            position: relative;
            z-index: 2;
            margin-top: auto;
            margin-bottom: auto;
        }

        .poster-bottom-row {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.72rem;
        }

        /* -------------------------------------------------------------
           核心项目各自独特的个性化字体与装置视觉设计（汉字字体全面适配）
           ------------------------------------------------------------- */

        /* 01. ANYCHEM PRO: 鼠尾草绿与玄武岩分子力学天体仪 (#9fb48d / #10161a) */
        .card-anychem {
            background: radial-gradient(circle at 75% 25%, #152219 0%, #0c1410 50%, #060a08 100%);
            border: 1px solid rgba(159, 180, 141, 0.45);
        }
        .card-bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            border-radius: inherit;
        }
        .card-anychem .chem-grid-wireframe {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: 28px 28px;
            background-image: 
                linear-gradient(to right, rgba(159, 180, 141, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(159, 180, 141, 0.06) 1px, transparent 1px);
            pointer-events: none;
            z-index: 0;
        }
        .card-anychem .card-bg-canvas {
            opacity: 0.95;
            z-index: 1;
        }
        .card-chemiation .card-bg-canvas {
            opacity: 0.95;
            z-index: 1;
        }
        .title-chem {
            font-family: var(--font-cinema);
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: #fff;
            line-height: 1.1;
            margin-bottom: 6px;
            text-shadow: 0 0 35px rgba(159, 180, 141, 0.55);
        }
        .sub-chem {
            font-family: var(--font-sans-cn);
            font-weight: 700;
            font-size: 1.08rem;
            color: var(--anychem-accent);
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }
        .desc-chem {
            font-family: var(--font-sans-cn);
            font-weight: 400;
            font-size: 0.9rem;
            line-height: 1.7;
            max-width: 520px;
            color: #d1dcce;
        }

        /* 02. BITPULSE: NES 2A03 荧光绿与碳晶黑复古芯片工作站 (#10b981 / #09090b) */
        .card-bitpulse {
            background: linear-gradient(135deg, #021a11 0%, #010f0a 60%, #000705 100%);
            border: 2px solid var(--bitpulse-green);
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.22);
        }
        .card-bitpulse .crt-lines-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.45) 0px, rgba(0, 0, 0, 0.45) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            z-index: 1;
        }
        .card-bitpulse .cartridge-gold-pins {
            position: absolute;
            top: 24px; bottom: 24px; right: 0;
            width: 14px;
            background: repeating-linear-gradient(180deg, #f59e0b 0px, #f59e0b 8px, #78350f 8px, #78350f 14px);
            border-left: 2px solid #000;
            opacity: 0.75;
            pointer-events: none;
            overflow: hidden;
        }
        .card-bitpulse .cartridge-gold-pins::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 40%;
            transform: translateY(-100%);
            background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.65), transparent);
            animation: goldPinShine 3.5s ease-in-out infinite;
        }
        @keyframes goldPinShine {
            0%, 30% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            80%, 100% { transform: translateY(350%); opacity: 0; }
        }
        .title-bit {
            font-family: var(--font-pixel);
            font-size: 2.1rem;
            color: var(--bitpulse-green);
            text-shadow: 0 0 25px rgba(16, 185, 129, 0.85);
            letter-spacing: 0.06em;
            line-height: 1.2;
            margin-bottom: 10px;
        }
        .sub-bit {
            font-family: var(--font-sans-cn);
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--bitpulse-mint);
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }
        .desc-bit {
            font-family: var(--font-sans-cn);
            font-weight: 400;
            font-size: 0.9rem;
            line-height: 1.7;
            max-width: 500px;
            color: #a7f3d0;
        }
        .bit-equalizer-bars {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 24px;
        }
        .bit-bar-pip {
            width: 6px;
            height: 100%;
            transform-origin: bottom;
            background: var(--bitpulse-green);
            border-radius: 1px;
            box-shadow: 0 0 6px var(--bitpulse-green);
            animation: liveWave 1.1s ease-in-out infinite alternate;
        }
        @keyframes liveWave {
            0% { transform: scaleY(0.2); opacity: 0.35; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        /* 03. CHEMIATION: 反应活性赭红与古朴深棕学术机理室 (#b84a28 / #c08a3e / #140b06) */
        .card-chemiation {
            background: radial-gradient(circle at 75% 25%, #34180d 0%, #1c0d06 50%, #0a0402 100%);
            border: 1px solid rgba(184, 74, 40, 0.55);
            box-shadow: 0 0 45px rgba(184, 74, 40, 0.22);
        }
        .card-chemiation .chem-parchment-glow {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 80% 20%, rgba(192, 138, 62, 0.26) 0%, rgba(184, 74, 40, 0.12) 35%, transparent 65%);
            pointer-events: none;
            animation: chemGlowPulse 5s ease-in-out infinite alternate;
        }
        @keyframes chemGlowPulse {
            0% { opacity: 0.55; }
            100% { opacity: 0.95; }
        }
        .pes-barrier-tag {
            display: inline-block;
            animation: pesPulse 2.4s ease-in-out infinite alternate;
        }
        @keyframes pesPulse {
            0% { text-shadow: 0 0 6px rgba(192, 138, 62, 0.4); }
            100% { text-shadow: 0 0 16px rgba(192, 138, 62, 0.95), 0 0 28px rgba(184, 74, 40, 0.6); }
        }
        .title-chemia {
            font-family: var(--font-cinema);
            font-size: 2.7rem;
            font-weight: 900;
            letter-spacing: 0.22em;
            color: #faf6e9;
            line-height: 1.1;
            margin-bottom: 6px;
            text-shadow: 0 0 35px rgba(184, 74, 40, 0.8);
        }
        .sub-chemia {
            font-family: var(--font-song);
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--chemiation-gold);
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }
        .desc-chemia {
            font-family: var(--font-song);
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.75;
            max-width: 520px;
            color: #ecdccb;
        }

        /* 04. PIXELME: 鸢尾花紫与街机点阵纸娃娃工坊 (#6c5ce7 / #00cec9 / #fd79a8) */
        .card-pixelme {
            background: linear-gradient(135deg, #1b1333 0%, #0e091c 60%, #06040c 100%);
            border: 2px solid var(--pixelme-iris);
            box-shadow: 0 0 45px rgba(108, 92, 231, 0.25);
        }
        .card-pixelme .arcade-grid-mesh {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: 18px 18px;
            background-image: 
                linear-gradient(to right, rgba(108, 92, 231, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(108, 92, 231, 0.1) 1px, transparent 1px);
            pointer-events: none;
        }
        .title-pix {
            font-family: var(--font-pixel);
            font-size: 2.1rem;
            color: #fff;
            letter-spacing: 0.06em;
            line-height: 1.2;
            margin-bottom: 10px;
            text-shadow: 4px 4px 0 var(--pixelme-iris), 0 0 25px rgba(108, 92, 231, 0.7);
        }
        .sub-pix {
            font-family: var(--font-sans-cn);
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--pixelme-pink);
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }
        .desc-pix {
            font-family: var(--font-sans-cn);
            font-weight: 400;
            font-size: 0.9rem;
            line-height: 1.7;
            max-width: 520px;
            color: #e9e5ff;
        }
        .pix-swatches-strip {
            display: flex;
            gap: 8px;
        }
        .pix-dot {
            width: 12px;
            height: 12px;
            border: 1px solid #000;
            box-shadow: 1px 1px 0 rgba(108, 92, 231, 0.6);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card-pixelme:hover .pix-dot:nth-child(1) { transform: translateY(-5px); transition-delay: 0.04s; }
        .card-pixelme:hover .pix-dot:nth-child(2) { transform: translateY(-5px); transition-delay: 0.08s; }
        .card-pixelme:hover .pix-dot:nth-child(3) { transform: translateY(-5px); transition-delay: 0.12s; }
        .card-pixelme:hover .pix-dot:nth-child(4) { transform: translateY(-5px); transition-delay: 0.16s; }

        /* 05. LITTLESC: TurboWarp 积木事件橙与 AST 编译器 (#ffab19 / #4c97ff / #0fbd8c) */
        .card-littlesc {
            background: linear-gradient(135deg, #241403 0%, #120901 60%, #060300 100%);
            border: 1px solid rgba(255, 171, 25, 0.5);
            box-shadow: 0 0 45px rgba(255, 171, 25, 0.2);
        }
        .card-littlesc .sc-bg-blocks-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .card-littlesc .sc-bg-blocks-svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.45));
            animation: scBlocksFloat 6s ease-in-out infinite alternate;
        }
        @keyframes scBlocksFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-7px) rotate(-0.8deg); }
        }
        .title-sc {
            font-family: var(--font-display);
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            color: #fff;
            line-height: 1.1;
            margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(255, 171, 25, 0.6);
        }
        .title-sc span {
            color: var(--littlesc-orange);
        }
        .sub-sc {
            font-family: var(--font-sans-cn);
            font-weight: 700;
            font-size: 1.06rem;
            color: var(--littlesc-orange);
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }
        .desc-sc {
            font-family: var(--font-sans-cn);
            font-weight: 400;
            font-size: 0.9rem;
            line-height: 1.7;
            max-width: 520px;
            color: #ffedd5;
        }
        .littlesc-diff-badge {
            display: inline-block;
            animation: diffBadgeGlow 2s ease-in-out infinite alternate;
        }
        @keyframes diffBadgeGlow {
            0% { opacity: 0.8; text-shadow: 0 0 6px var(--littlesc-diff); }
            100% { opacity: 1; text-shadow: 0 0 16px var(--littlesc-diff); }
        }

        /* 06. GIFEDITOR: UE5 蓝图 Slate 深青与 DAG 拓扑连线 (#38bdf8 / #f59e0b / #070d18) */
        .card-gifeditor {
            background: radial-gradient(circle at 80% 20%, #0d1b2e 0%, #07101c 50%, #03060a 100%);
            border: 1px solid rgba(56, 189, 248, 0.45);
            box-shadow: 0 0 45px rgba(56, 189, 248, 0.16);
        }
        .card-gifeditor .blueprint-grid-mesh {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: 24px 24px;
            background-image: 
                linear-gradient(to right, rgba(56, 189, 248, 0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.07) 1px, transparent 1px);
            pointer-events: none;
        }
        .card-gifeditor .blueprint-wire-svg {
            position: absolute;

    <!-- 核心交互逻辑：智能链接、防卡顿手势解耦 3D 引擎、草书笔画重聚与无级平滑向淡黄宣纸变色 -->
    <script>
        /* 1. 链接自适应 (本地 file: 与 GitHub Pages 在线环境双向兼容) */
        function resolveUrl(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            if (url.startsWith('works/') || url.startsWith('./works/')) {
                return url;
            }
            if (window.location.protocol === 'file:') {
                return '../' + url;
            }
            return url;
        }

        (function adaptSmartLinks() {
            document.querySelectorAll('.smart-link').forEach(link => {
                const targetPath = link.getAttribute('data-path');
                if (targetPath) {
                    link.setAttribute('href', resolveUrl(targetPath));
                }
            });
        })();

        /* 2. 3D 装置流物理引擎 (手势与点击严格解耦，彻底避免滑动卡死) */
        const DeckEngine = (function() {
            const stage = document.getElementById('deckStage');
            const indicatorBar = document.getElementById('indicatorBar');
            if (!stage) return null;

            const total = ARTIFACT_ITEMS.length;
            let currentPos = 0;
            let targetPos = 0;
            let activeIdx = 0;

            // 拖拽手势物理状态
            let isPointerDown = false;
            let startPointerX = 0;
            let startPos = 0;
            let lastPointerX = 0;
            let lastMoveTime = 0;
            let dragVelocity = 0;
            let hasMovedSignificantly = false;

            // 鼠标 3D 视差俯仰
            let mouseTiltX = 0;
            let mouseTiltY = 0;
            let curTiltX = 0;
            let curTiltY = 0;

            let stageRect = null;
            let needsCardRender = true;

            function updateStageRect() {
                if (stage) stageRect = stage.getBoundingClientRect();
            }

            const cardElements = [];
            let renderAnychemMol = null;
            let renderChemiationStruct = null;
            let isDeckVisible = true;
            let deckRAF = null;

            function requestDeckLoop() {
                if (!deckRAF && isDeckVisible) {
                    deckRAF = requestAnimationFrame(renderLoop);
                }
            }

            function init() {
                stage.innerHTML = '';
                indicatorBar.innerHTML = '';

                ARTIFACT_ITEMS.forEach((item, i) => {
                    const card = document.createElement('div');
                    card.className = `poster-artifact-card ${item.customClass}`;
                    card.setAttribute('data-index', i);
                    card.innerHTML = item.innerMarkup;

                    // 禁用浏览器原生拖拽干扰
                    card.ondragstart = () => false;

                    // 点击卡片：若居中则直接进入项目，若在两侧则滑至中心
                    card.addEventListener('click', (e) => {
                        if (hasMovedSignificantly) return;
                        if (i === activeIdx) {
                            const targetUrl = resolveUrl(item.launchUrl);
                            if (item.launchUrl.startsWith('http')) {
                                window.open(targetUrl, '_blank', 'noopener,noreferrer');
                            } else {
                                window.location.href = targetUrl;
                            }
                        } else {
                            goTo(i);
                        }
                    });

                    stage.appendChild(card);
                    cardElements.push(card);

                    // 极简长圆柱指示条
                    const pill = document.createElement('div');
                    pill.className = 'deck-indicator-pill' + (i === 0 ? ' active' : '');
                    pill.addEventListener('click', () => goTo(i));
                    indicatorBar.appendChild(pill);
                });

                bindEvents();
                renderAnychemMol = initAnychemMoleculeSimulation();
                renderChemiationStruct = initChemiationStructureSimulation();

                // 视口感知：仅当 3D 展台在可视范围内时才调度 rAF，离屏时彻底暂停
                const deckObserver = new IntersectionObserver((entries) => {
                    isDeckVisible = entries[0].isIntersecting;
                    if (isDeckVisible) {
                        requestDeckLoop();
                    } else if (deckRAF) {
                        cancelAnimationFrame(deckRAF);
                        deckRAF = null;
                    }
                }, { threshold: 0.04 });
                deckObserver.observe(stage);

                requestDeckLoop();
            }

            function getShortestDistance(fromIdx, toIdx) {
                let diff = (toIdx - fromIdx) % total;
                if (diff > total / 2) diff -= total;
                if (diff < -total / 2) diff += total;
                return diff;
            }

            function goTo(idx) {
                const diff = getShortestDistance(activeIdx, idx);
                targetPos += diff;
                activeIdx = idx;
                updateIndicators();
                needsCardRender = true;
                requestDeckLoop();
            }

            function next() {
                targetPos = Math.round(targetPos) + 1;
                activeIdx = ((Math.round(targetPos) % total) + total) % total;
                updateIndicators();
                needsCardRender = true;
                requestDeckLoop();
            }

            function prev() {
                targetPos = Math.round(targetPos) - 1;
                activeIdx = ((Math.round(targetPos) % total) + total) % total;
                updateIndicators();
                needsCardRender = true;
                requestDeckLoop();
            }

            function updateIndicators() {
                const pills = indicatorBar.querySelectorAll('.deck-indicator-pill');
                pills.forEach((p, i) => p.classList.toggle('active', i === activeIdx));
            }

            function bindEvents() {
                updateStageRect();
                window.addEventListener('resize', updateStageRect, { passive: true });
                window.addEventListener('scroll', updateStageRect, { passive: true });

                // 鼠标与触摸按下
                stage.addEventListener('pointerdown', (e) => {
                    isPointerDown = true;
                    hasMovedSignificantly = false;
                    startPointerX = e.clientX;
                    startPos = targetPos;
                    lastPointerX = e.clientX;
                    lastMoveTime = performance.now();
                    dragVelocity = 0;
                    needsCardRender = true;
                    requestDeckLoop();
                });

                window.addEventListener('pointermove', (e) => {
                    // 鼠标 3D 倾斜计算（使用缓存的 stageRect，彻底杜绝指针移动引发的强制同步重排）
                    if (!stageRect) updateStageRect();
                    if (stageRect && e.clientY >= stageRect.top && e.clientY <= stageRect.bottom) {
                        const newTiltX = ((e.clientY - (stageRect.top + stageRect.height / 2)) / (stageRect.height / 2)) * -8;
                        const newTiltY = ((e.clientX - (stageRect.left + stageRect.width / 2)) / (stageRect.width / 2)) * 8;
                        if (Math.abs(newTiltX - mouseTiltX) > 0.05 || Math.abs(newTiltY - mouseTiltY) > 0.05) {
                            mouseTiltX = newTiltX;
                            mouseTiltY = newTiltY;
                            needsCardRender = true;
                            requestDeckLoop();
                        }
                    }

                    if (!isPointerDown) return;
                    const deltaX = e.clientX - startPointerX;
                    if (Math.abs(deltaX) > 6) {
                        hasMovedSignificantly = true;
                    }

                    const cardWidth = window.innerWidth < 768 ? 250 : 420;
                    targetPos = startPos - (deltaX / cardWidth);

                    const now = performance.now();
                    const dt = now - lastMoveTime;
                    if (dt > 10) {
                        dragVelocity = (e.clientX - lastPointerX) / dt;
                        lastPointerX = e.clientX;
                        lastMoveTime = now;
                    }
                    needsCardRender = true;
                    requestDeckLoop();
                });

                const onPointerUp = () => {
                    if (!isPointerDown) return;
                    isPointerDown = false;

                    // 惯性对齐 (环形无锁，自由循环)
                    targetPos -= dragVelocity * 0.35;
                    targetPos = Math.round(targetPos);
                    activeIdx = ((targetPos % total) + total) % total;
                    updateIndicators();
                    needsCardRender = true;
                    requestDeckLoop();
                };

                window.addEventListener('pointerup', onPointerUp);
                window.addEventListener('pointercancel', onPointerUp);

                // 鼠标滚轮推演 (带缓冲锁防卡死)
                let wheelLock = false;
                stage.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    if (wheelLock) return;
                    if (Math.abs(e.deltaY) > 20 || Math.abs(e.deltaX) > 20) {
                        wheelLock = true;
                        if (e.deltaY > 0 || e.deltaX > 0) next();
                        else prev();
                        setTimeout(() => { wheelLock = false; }, 260);
                    }
                }, { passive: false });

                // 键盘左右键支持
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight') next();
                    if (e.key === 'ArrowLeft') prev();
                });
            }

            // 01. AnyChem: 旋转 3D 分子模型投影 (单色高科技质感，严格与卡牌主题色 #9fb48d 保持一致)
            function initAnychemMoleculeSimulation() {
                const canvas = document.getElementById('anychem-mol-canvas');
                if (!canvas) return null;
                const ctx = canvas.getContext('2d');
                const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
                canvas.width = 660 * dpr;
                canvas.height = 372 * dpr;
                ctx.scale(dpr, dpr);

                // 3D 苯环与共振结构模型 (Benzene C₆H₆: 6 个碳原子 + 6 个氢原子 + 离域大Π键环)
                const rc = 64;  // 碳环半径
                const rh = 106; // 氢原子半径
                const carbons = [];
                const hydrogens = [];
                for (let i = 0; i < 6; i++) {
                    const ang = (i * Math.PI) / 3;
                    carbons.push({ x: rc * Math.cos(ang), y: rc * Math.sin(ang), z: 0 });
                    hydrogens.push({ x: rh * Math.cos(ang), y: rh * Math.sin(ang), z: 0 });
                }

                let lastMolTime = 0;
                return function render(time) {
                    if (time - lastMolTime < 28) return;
                    lastMolTime = time;

                    ctx.clearRect(0, 0, 660, 372);
                    const cx = 465;
                    const cy = 186;

                    // 空间 3D 自转 (Yaw / Pitch / Roll)
                    const rotY = time * 0.00075;
                    const rotX = 0.42 + Math.sin(time * 0.0005) * 0.22;
                    const rotZ = time * 0.00035;

                    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
                    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
                    const cosZ = Math.cos(rotZ), sinZ = Math.sin(rotZ);

                    function project(p) {
                        const x1 = p.x * cosZ - p.y * sinZ;
                        const y1 = p.x * sinZ + p.y * cosZ;
                        const z1 = p.z;

                        const x2 = x1 * cosY + z1 * sinY;
                        const z2 = -x1 * sinY + z1 * cosY;

                        const y3 = y1 * cosX - z2 * sinX;
                        const z3 = y1 * sinX + z2 * cosX;

                        const fov = 380;
                        const scale = fov / (fov - z3);
                        return {
                            sx: cx + x2 * scale,
                            sy: cy + y3 * scale,
                            sz: z3,
                            scale
                        };
                    }

                    const projC = carbons.map(project);
                    const projH = hydrogens.map(project);

                    // 绘制上下离域电子云环 (大Π键共振虚线投影)
                    [-20, 20].forEach(offsetZ => {
                        ctx.save();
                        ctx.beginPath();
                        const segments = 24;
                        for (let j = 0; j <= segments; j++) {
                            const a = (j * Math.PI * 2) / segments;
                            const pt = project({ x: rc * Math.cos(a), y: rc * Math.sin(a), z: offsetZ });
                            if (j === 0) ctx.moveTo(pt.sx, pt.sy);
                            else ctx.lineTo(pt.sx, pt.sy);
                        }
                        ctx.setLineDash([4, 4]);
                        ctx.strokeStyle = 'rgba(159, 180, 141, 0.16)';
                        ctx.lineWidth = 1.2;
                        ctx.stroke();
                        ctx.restore();
                    });

                    // 收集共价键并按深度排序绘制
                    const edges = [];
                    for (let i = 0; i < 6; i++) {
                        const next = (i + 1) % 6;
                        edges.push({
                            type: 'cc',
                            order: (i % 2 === 0) ? 2 : 1,
                            p1: projC[i],
                            p2: projC[next],
                            avgZ: (projC[i].sz + projC[next].sz) * 0.5
                        });
                    }
                    for (let i = 0; i < 6; i++) {
                        edges.push({
                            type: 'ch',
                            order: 1,
                            p1: projC[i],
                            p2: projH[i],
                            avgZ: (projC[i].sz + projH[i].sz) * 0.5
                        });
                    }

                    edges.sort((a, b) => a.avgZ - b.avgZ);

                    ctx.lineCap = 'round';
                    edges.forEach(edge => {
                        const { p1, p2, order, type, avgZ } = edge;
                        const alpha = Math.max(0.12, Math.min(0.55, 0.28 + (avgZ / 120) * 0.25));

                        if (type === 'cc') {
                            if (order === 2) {
                                const dx = p2.sx - p1.sx;
                                const dy = p2.sy - p1.sy;
                                const len = Math.hypot(dx, dy) || 1;
                                const nx = (-dy / len) * 3.2;
                                const ny = (dx / len) * 3.2;

                                ctx.strokeStyle = `rgba(159, 180, 141, ${alpha})`;
                                ctx.lineWidth = 1.6;
                                ctx.beginPath();
                                ctx.moveTo(p1.sx + nx, p1.sy + ny);
                                ctx.lineTo(p2.sx + nx, p2.sy + ny);
                                ctx.moveTo(p1.sx - nx, p1.sy - ny);
                                ctx.lineTo(p2.sx - nx, p2.sy - ny);
                                ctx.stroke();
                            } else {
                                ctx.strokeStyle = `rgba(159, 180, 141, ${alpha})`;
                                ctx.lineWidth = 1.6;
                                ctx.beginPath();
                                ctx.moveTo(p1.sx, p1.sy);
                                ctx.lineTo(p2.sx, p2.sy);
                                ctx.stroke();
                            }
                        } else {
                            ctx.strokeStyle = `rgba(159, 180, 141, ${alpha * 0.75})`;
                            ctx.lineWidth = 1.2;
                            ctx.beginPath();
                            ctx.moveTo(p1.sx, p1.sy);
                            ctx.lineTo(p2.sx, p2.sy);
                            ctx.stroke();
                        }
                    });

                    // 收集原子并按深度绘制 (颜色单一和卡牌一致: #9fb48d)
                    const atoms = [];
                    projC.forEach(p => atoms.push({ type: 'C', p }));
                    projH.forEach(p => atoms.push({ type: 'H', p }));
                    atoms.sort((a, b) => a.p.sz - b.p.sz);

                    atoms.forEach(atom => {
                        const { type, p } = atom;
                        const alpha = Math.max(0.2, Math.min(0.9, 0.5 + (p.sz / 120) * 0.35));
                        const r = (type === 'C' ? 4.8 : 2.8) * p.scale;

                        if (type === 'C') {
                            ctx.beginPath();
                            ctx.arc(p.sx, p.sy, r + 3.5 * p.scale, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(159, 180, 141, 0.16)';
                            ctx.fill();
                        }
                        ctx.beginPath();
                        ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(159, 180, 141, ${alpha})`;
                        ctx.fill();
                    });
                };
            }

            // 03. Chemiation: 3D 反应机理结构式仿真 (经典伪 3D 字母排印与化学键模型)
            function initChemiationStructureSimulation() {
                const canvas = document.getElementById('chemiation-struct-canvas');
                if (!canvas) return null;
                const ctx = canvas.getContext('2d');
                const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
                canvas.width = 660 * dpr;
                canvas.height = 372 * dpr;
                ctx.scale(dpr, dpr);

                // Chemiation 经典乙酸/反应活性中间体拓扑坐标
                const rawAtoms = [
                    { id: 'C1', el: 'C', x: -68, y: -18, z: 12 },
                    { id: 'H1', el: 'H', x: -108, y: -10, z: 32 },
                    { id: 'H2', el: 'H', x: -62, y: -68, z: 14 },
                    { id: 'H3', el: 'H', x: -75, y: -12, z: -32 },
                    { id: 'C2', el: 'C', x: 2, y: 14, z: 0 },
                    { id: 'O1', el: 'O', x: 12, y: 72, z: -16, isCarbonyl: true },
                    { id: 'O2', el: 'O', x: 58, y: -26, z: 14 },
                    { id: 'H4', el: 'H', x: 96, y: -18, z: 10 },
                    { id: 'C3', el: 'C', x: 76, y: 36, z: -10 },
                    { id: 'H5', el: 'H', x: 74, y: 80, z: -26 },
                    { id: 'C4', el: 'C', x: 128, y: 16, z: 16 },
                    { id: 'H6', el: 'H', x: 166, y: 34, z: 12 },
                    { id: 'H7', el: 'H', x: 124, y: -30, z: 34 }
                ];

                const rawBonds = [
                    { a1: 0, a2: 1, order: 1 },
                    { a1: 0, a2: 2, order: 1 },
                    { a1: 0, a2: 3, order: 1 },
                    { a1: 0, a2: 4, order: 1 },
                    { a1: 4, a2: 5, order: 2 },
                    { a1: 4, a2: 6, order: 1 },
                    { a1: 6, a2: 7, order: 1 },
                    { a1: 4, a2: 8, order: 1 },
                    { a1: 8, a2: 9, order: 1 },
                    { a1: 8, a2: 10, order: 1 },
                    { a1: 10, a2: 11, order: 1 },
                    { a1: 10, a2: 12, order: 1 }
                ];

                let lastChemTime = 0;
                return function render(time) {
                    if (time - lastChemTime < 28) return;
                    lastChemTime = time;

                    ctx.clearRect(0, 0, 660, 372);
                    const cx = 475;
                    const cy = 186;

                    // 空间伪 3D 慢速平滑自转
                    const rotY = time * 0.00065;
                    const rotX = 0.35 + Math.sin(time * 0.00045) * 0.18;
                    const rotZ = -0.12 + Math.cos(time * 0.00035) * 0.08;

                    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
                    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
                    const cosZ = Math.cos(rotZ), sinZ = Math.sin(rotZ);

                    let minZ = Infinity, maxZ = -Infinity;
                    const projectedAtoms = rawAtoms.map(atom => {
                        const x1 = atom.x * cosZ - atom.y * sinZ;
                        const y1 = atom.x * sinZ + atom.y * cosZ;
                        const z1 = atom.z;

                        const x2 = x1 * cosY + z1 * sinY;
                        const z2 = -x1 * sinY + z1 * cosY;

                        const y3 = y1 * cosX - z2 * sinX;
                        const z3 = y1 * sinX + z2 * cosX;

                        if (z3 < minZ) minZ = z3;
                        if (z3 > maxZ) maxZ = z3;

                        const fov = 380;
                        const scale = fov / (fov - z3);
                        return {
                            ...atom,
                            sx: cx + x2 * scale,
                            sy: cy + y3 * scale,
                            sz: z3,
                            scale
                        };
                    });

                    const zRange = Math.max(1, maxZ - minZ);
                    projectedAtoms.forEach(atom => {
                        atom.depth = (atom.sz - minZ) / zRange;
                        atom.fontSize = Math.round(15 + atom.depth * 13);
                        atom.clipRadius = atom.fontSize * 0.46;
                    });

                    const renderBonds = rawBonds.map(b => {
                        const a1 = projectedAtoms[b.a1];
                        const a2 = projectedAtoms[b.a2];
                        return {
                            ...b,
                            a1,
                            a2,
                            avgZ: (a1.sz + a2.sz) * 0.5,
                            avgDepth: (a1.depth + a2.depth) * 0.5
                        };
                    });

                    const queue = [];
                    renderBonds.forEach(b => queue.push({ type: 'bond', z: b.avgZ, data: b }));
                    projectedAtoms.forEach(a => queue.push({ type: 'atom', z: a.sz, data: a }));
                    queue.sort((a, b) => a.z - b.z);

                    ctx.lineCap = 'round';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    queue.forEach(item => {
                        if (item.type === 'bond') {
                            const b = item.data;
                            const { a1, a2, order, avgDepth } = b;
                            const dx = a2.sx - a1.sx;
                            const dy = a2.sy - a1.sy;
                            const dist = Math.hypot(dx, dy) || 1;
                            const ux = dx / dist;
                            const uy = dy / dist;

                            // 严格自字母边缘出线，绝不侵入字形
                            const startX = a1.sx + ux * a1.clipRadius;
                            const startY = a1.sy + uy * a1.clipRadius;
                            const endX = a2.sx - ux * a2.clipRadius;
                            const endY = a2.sy - uy * a2.clipRadius;

                            if (Math.hypot(endX - startX, endY - startY) < 2) return;

                            const nx = -uy;
                            const ny = ux;
                            const alpha = 0.22 + avgDepth * 0.55;
                            const lineWidth = 1.3 + avgDepth * 1.5;

                            ctx.strokeStyle = `rgba(192, 138, 62, ${alpha})`;
                            ctx.lineWidth = lineWidth;

                            if (order === 2) {
                                const offset = 3.2;
                                ctx.beginPath();
                                ctx.moveTo(startX + nx * offset, startY + ny * offset);
                                ctx.lineTo(endX + nx * offset, endY + ny * offset);
                                ctx.moveTo(startX - nx * offset, startY - ny * offset);
                                ctx.lineTo(endX - nx * offset, endY - ny * offset);
                                ctx.stroke();
                            } else {
                                ctx.beginPath();
                                ctx.moveTo(startX, startY);
                                ctx.lineTo(endX, endY);
                                ctx.stroke();
                            }
                        } else {
                            const a = item.data;
                            const { el, sx, sy, fontSize, depth } = a;

                            ctx.font = `bold ${fontSize}px "Century Gothic", "Cinzel", "Times New Roman", serif`;

                            // 纯净无描边统一字体排印（无黑边、无颜色差异）
                            const alpha = 0.42 + depth * 0.52;
                            ctx.fillStyle = `rgba(235, 218, 200, ${alpha})`;
                            ctx.fillText(el, sx, sy);
                        }
                    });
                };
            }

            function renderLoop() {
                const posDiff = targetPos - currentPos;
                const tiltXDiff = mouseTiltX - curTiltX;
                const tiltYDiff = mouseTiltY - curTiltY;
                const isDeckMoving = isPointerDown || Math.abs(posDiff) > 0.0005 || Math.abs(tiltXDiff) > 0.005 || Math.abs(tiltYDiff) > 0.005;

                if (isDeckMoving) {
                    currentPos += posDiff * 0.12;
                    curTiltX += tiltXDiff * 0.08;
                    curTiltY += tiltYDiff * 0.08;

                    if (Math.abs(targetPos - currentPos) < 0.0005) currentPos = targetPos;
                    if (Math.abs(mouseTiltX - curTiltX) < 0.005) curTiltX = mouseTiltX;
                    if (Math.abs(mouseTiltY - curTiltY) < 0.005) curTiltY = mouseTiltY;
                    needsCardRender = true;
                }

                const isMobile = window.innerWidth < 768;
                const spacing = isMobile ? 250 : 420;
                const depthZ = isMobile ? 150 : 250;

                // 防止整数偏移量无上限累加，静止且偏移极大时平滑移位
                if (!isPointerDown && Math.abs(targetPos) > 100 && Math.abs(targetPos - currentPos) < 0.01) {
                    const shifts = Math.floor(targetPos / total) * total;
                    targetPos -= shifts;
                    currentPos -= shifts;
                }

                // 运动趋势与方向感知（用于无缝层叠防穿插）
                const delta = targetPos - currentPos;

                let isAnychemVisible = false;
                let isChemiationVisible = false;

                if (needsCardRender) {
                    cardElements.forEach((card, i) => {
                        // 环形最短拓扑距离计算：把当前卡片投影至 [-total/2, total/2] 扇区
                        let offset = ((i - currentPos) % total + total) % total;
                        if (offset > total / 2) {
                            offset -= total;
                        }
                        const absOffset = Math.abs(offset);

                        // 空间 3D 几何变换：采用幂函数加深远离中心的深度衰减，消除邻近卡牌边缘空间干涉
                        const tx = offset * spacing;
                        const tz = -Math.pow(Math.min(absOffset, 2.5), 1.15) * depthZ;
                        
                        // 旋转角度适度收敛（桌面端 20deg，移动端 14deg），杜绝宽卡片大幅旋转时前边缘侵入主卡片
                        const maxRot = isMobile ? 14 : 20;
                        const clampedOffset = Math.max(-1.5, Math.min(1.5, offset));
                        const ry = -clampedOffset * maxRot + (absOffset < 0.5 ? curTiltY : 0);
                        const rx = absOffset < 0.5 ? curTiltX : 0;
                        const scale = 1 - Math.min(absOffset * 0.12, 0.42);
                        
                        // 当卡片转至侧后方时渐隐，杜绝在背面翻折时产生穿帮跳动
                        let opacity = 0;
                        if (absOffset < 2.6) {
                            opacity = Math.max(0, 1 - absOffset * 0.38);
                        }

                        // 精准识别带有独立 3D 模型的卡片是否面向用户（若在背侧或不可见则停止模型计算）
                        if (i === 0 && absOffset < 1.6 && opacity > 0.05) isAnychemVisible = true;
                        if (i === 2 && absOffset < 1.6 && opacity > 0.05) isChemiationVisible = true;

                        // 高精度连续 z-index 计算与运动方向动态偏置（彻底解决相同 zIndex 导致的层级跳变与突兀穿插）
                        let dirBias = 0;
                        if (Math.abs(delta) > 0.01) {
                            if ((delta > 0 && offset > 0) || (delta < 0 && offset < 0)) {
                                dirBias = 3;
                            }
                        }
                        const zIndex = Math.round(1000 - absOffset * 100) + dirBias;

                        const transStr = `translate3d(${tx.toFixed(1)}px, 0, ${tz.toFixed(1)}px) rotateY(${ry.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
                        const opStr = opacity.toFixed(3);
                        const visStr = opacity <= 0.01 ? 'hidden' : 'visible';

                        if (card._lastTrans !== transStr) { card.style.transform = transStr; card._lastTrans = transStr; }
                        if (card._lastOp !== opStr) { card.style.opacity = opStr; card._lastOp = opStr; }
                        if (card._lastZ !== zIndex) { card.style.zIndex = zIndex; card._lastZ = zIndex; }
                        if (card._lastVis !== visStr) { card.style.visibility = visStr; card._lastVis = visStr; }
                    });

                    if (!isDeckMoving) {
                        needsCardRender = false;
                    }
                } else {
                    let offset0 = ((0 - currentPos) % total + total) % total;
                    if (offset0 > total / 2) offset0 -= total;
                    if (Math.abs(offset0) < 1.6) isAnychemVisible = true;

                    let offset2 = ((2 - currentPos) % total + total) % total;
                    if (offset2 > total / 2) offset2 -= total;
                    if (Math.abs(offset2) < 1.6) isChemiationVisible = true;
                }

                // 仅当 AnyChem 与 Chemiation 卡片处于正面可视范围时才计算与绘制 3D 分子动态模型
                const animTime = performance.now();
                if (isAnychemVisible && renderAnychemMol) renderAnychemMol(animTime);
                if (isChemiationVisible && renderChemiationStruct) renderChemiationStruct(animTime);

                // 静止且无独立模型运动时休眠 rAF，杜绝后台空转
                if (!isDeckVisible || (!isDeckMoving && !isAnychemVisible && !isChemiationVisible && !isPointerDown)) {
                    deckRAF = null;
                    return;
                }

                deckRAF = requestAnimationFrame(renderLoop);
            }

            return {
                init,
                next,
                prev,
                goTo
            };
        })();

        if (DeckEngine) {
            DeckEngine.init();
        }

        /* 3. 星空粒子 Canvas (90 颗星点，按透明度分桶批量绘制，减少 95% Canvas API 调度) */
        const CosmosEngine = (function() {
            const canvas = document.getElementById('cosmos-canvas');
            if (!canvas) return null;
            const ctx = canvas.getContext('2d');
            let w, h;
            const stars = [];
            const count = 90;
            let isVisible = true;
            let rAFId = null;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize, { passive: true });
            resize();

            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 1.5 + 0.4,
                    alpha: Math.random() * 0.75 + 0.25,
                    speed: Math.random() * 0.22 + 0.05,
                    pulse: Math.random() * Math.PI * 2
                });
            }

            let mouseX = 0, mouseY = 0;
            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - w / 2) * 0.03;
                mouseY = (e.clientY - h / 2) * 0.03;
            }, { passive: true });

            let lastStarTime = 0;
            function render(time) {
                if (!isVisible) {
                    rAFId = null;
                    return;
                }

                rAFId = requestAnimationFrame(render);
                if (time - lastStarTime < 30) return;
                lastStarTime = time;

                ctx.clearRect(0, 0, w, h);
                const t = time * 0.0018;

                // 按亮度分桶，仅执行 3 次 beginPath / fill，彻底消除逐点描画的性能瓶颈
                const binLow = [];
                const binMid = [];
                const binHigh = [];

                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    s.y -= s.speed;
                    if (s.y < 0) s.y = h;

                    const drawX = s.x - mouseX * (s.size * 0.4);
                    const drawY = s.y - mouseY * (s.size * 0.4);
                    const twinkle = Math.sin(t + s.pulse) * 0.35 + 0.65;
                    const finalAlpha = s.alpha * twinkle;

                    if (finalAlpha < 0.4) {
                        binLow.push(drawX, drawY, s.size);
                    } else if (finalAlpha < 0.7) {
                        binMid.push(drawX, drawY, s.size);
                    } else {
                        binHigh.push(drawX, drawY, s.size);
                    }
                }

                function drawBin(bin, color) {
                    if (bin.length === 0) return;
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    for (let i = 0; i < bin.length; i += 3) {
                        ctx.moveTo(bin[i] + bin[i + 2], bin[i + 1]);
                        ctx.arc(bin[i], bin[i + 1], bin[i + 2], 0, Math.PI * 2);
                    }
                    ctx.fill();
                }

                drawBin(binLow, 'rgba(219, 234, 254, 0.3)');
                drawBin(binMid, 'rgba(219, 234, 254, 0.6)');
                drawBin(binHigh, 'rgba(219, 234, 254, 0.95)');
            }

            function setVisible(val) {
                if (isVisible === val) return;
                isVisible = val;
                if (isVisible) {
                    if (!rAFId) rAFId = requestAnimationFrame(render);
                } else {
                    if (rAFId) {
                        cancelAnimationFrame(rAFId);
                        rAFId = null;
                    }
                    ctx.clearRect(0, 0, w, h);
                }
            }

            rAFId = requestAnimationFrame(render);

            return {
                setVisible
            };
        })();

        
</script>
