<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="XRJprogram 个人主页：代码、平面设计与空间线构。">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f0ff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><line x1='12' y1='3' x2='12' y2='21'/><line x1='3' y1='12' x2='21' y2='12'/></svg>">

    <!-- 典雅字体：Space Grotesk、JetBrains Mono 与人文黑体 -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap">

    <style>
        :root {
            --bg-void: #030408;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --text-dim: #64748b;
            --line-cyan: #00f0ff;
            --line-pink: #f472b6;
            --font-display: 'Space Grotesk', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', 'Noto Sans SC', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        html, body {
            background-color: var(--bg-void);
            color: var(--text-main);
            font-family: var(--font-sans);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 纯黑背景微弱径向渐晕 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 65% 50%, rgba(0, 240, 255, 0.035) 0%, transparent 60%),
                radial-gradient(circle at 30% 60%, rgba(244, 114, 182, 0.025) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* 全屏自适应 Canvas 画布 */
        #generative-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* 极简主义：全幅前景大文字排版层（无分栏、无点击点） */
        .stage-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(24px, 4.5vw, 56px);
        }

        /* 顶部边缘极简印记 */
        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: clamp(0.68rem, 0.85vw, 0.78rem);
            color: var(--text-dim);
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }
        .header-brand {
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            pointer-events: auto;
        }
        .brand-dot {
            width: 6px;
            height: 6px;
            background: var(--line-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--line-cyan);
        }

        /* 核心大文字区域：高冲击力瑞士极简主义排版 */
        .hero-block {
            max-width: 960px;
            margin-top: auto;
            margin-bottom: auto;
            padding-top: 4vh;
        }
        .hero-label {
            font-family: var(--font-mono);
            font-size: clamp(0.7rem, 0.95vw, 0.84rem);
            color: var(--line-cyan);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hero-label::before {
            content: '';
            width: 24px;
            height: 1px;
            background: var(--line-cyan);
            opacity: 0.8;
        }
        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(4.2rem, 11vw, 9.8rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 0.92;
            color: #ffffff;
            margin-bottom: 24px;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }
        .hero-desc {
            font-family: var(--font-sans);
            font-size: clamp(0.95rem, 1.35vw, 1.15rem);
            line-height: 1.85;
            color: var(--text-sub);
            max-width: 580px;
            font-weight: 300;
        }
        .hero-desc strong {
            color: #fff;
            font-weight: 500;
        }

        /* 底部边缘极简导航与状态标注（无任何按钮或点击点，仅保留版面文本链接） */
        .footer-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: var(--font-mono);
            font-size: clamp(0.68rem, 0.85vw, 0.78rem);
            letter-spacing: 0.14em;
            color: var(--text-dim);
            pointer-events: auto;
        }
        .footer-nav {
            display: flex;
            align-items: center;
            gap: 16px;
            text-transform: uppercase;
        }
        .footer-link {
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.2s ease;
            position: relative;
        }
        .footer-link:hover {
            color: #fff;
        }
        .footer-sep {
            color: rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 768px) {
            .footer-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 动态连续变幻 3D 线构 Canvas -->
    <canvas id="generative-canvas"></canvas>

    <!-- 极简大文字排版层 -->
    <main class="stage-overlay">
        <!-- 顶栏极简标注 -->
        <header class="header-meta">
            <a href="index.html" class="header-brand">
                <span class="brand-dot"></span>
                <span>XRJ // 2026</span>
            </a>
            <span>SPATIAL LINE ARCHIVE</span>
        </header>

        <!-- 居中大文字主体 -->
        <div class="hero-block">
            <span class="hero-label">PROFILE // CREATIVE CODE &amp; DESIGN</span>
            <h1 class="hero-title">XRJprogram</h1>
            <p class="hero-desc">
                你好，这里是 <strong>XRJprogram</strong>。在纯黑与极细线条之间，打磨平面视觉、代码与空间微巧思。写过长卷《幻想城》，也用纯数学公式在浏览器里捕捉流动的几何形态。
            </p>
        </div>

        <!-- 底部边缘全站跳板（纯文本链接，无按钮感） -->
        <footer class="footer-meta">
            <nav class="footer-nav">
                <a href="projects.html" class="footer-link">Projects</a>
                <span class="footer-sep">/</span>
                <a href="FantasyCity/index.html" class="footer-link smart-link" data-path="FantasyCity/index.html">Fantasy City</a>
                <span class="footer-sep">/</span>
                <a href="works/index.html" class="footer-link">Scratch Works</a>
            </nav>
            <span>CONTINUOUS 3D MORPH // AUTONOMOUS</span>
        </footer>
    </main>

    <!-- ============================================================
       不断变幻的三维参数化线条组渲染引擎 (原生 Canvas 2D，自主演进，零重排)
       ============================================================ -->
    <script>
        // 智能路径适配 (兼容本地 file: 与 GitHub Pages 线上多仓库结构)
        if (window.location.protocol === 'file:') {
            document.querySelectorAll('.smart-link').forEach(link => {
                const targetPath = link.getAttribute('data-path');
                if (targetPath) {
                    link.setAttribute('href', '../' + targetPath);
                }
            });
        }

        (function() {
            const canvas = document.getElementById('generative-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let w = 0, h = 0;
            let dpr = 1;
            let animId = null;

            // 视角与平滑动力学
            let rotX = 0.25;
            let rotY = 0.35;
            let targetRotX = 0.25;
            let targetRotY = 0.35;
            let isPointerInteracting = false;
            let lastMouseX = 0, lastMouseY = 0;

            function resize() {
                w = window.innerWidth;
                h = window.innerHeight;
                dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                ctx.scale(dpr, dpr);
            }

            // 监听指针微弱视差互动
            window.addEventListener('resize', resize, { passive: true });

            window.addEventListener('pointerdown', (e) => {
                isPointerInteracting = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            window.addEventListener('pointermove', (e) => {
                const nx = (e.clientX / w - 0.5) * 2;
                const ny = (e.clientY / h - 0.5) * 2;
                if (isPointerInteracting) {
                    const dx = e.clientX - lastMouseX;
                    const dy = e.clientY - lastMouseY;
                    targetRotY += dx * 0.005;
                    targetRotX -= dy * 0.005;
                    lastMouseX = e.clientX;
                    lastMouseY = e.clientY;
                } else {
                    targetRotY += nx * 0.0004;
                    targetRotX -= ny * 0.0004;
                }
            });

            window.addEventListener('pointerup', () => { isPointerInteracting = false; });
            window.addEventListener('pointercancel', () => { isPointerInteracting = false; });

            // 透视投影
            const fov = 720;
            function project(x, y, z, rotCosX, rotSinX, rotCosY, rotSinY, cx, cy) {
                const x1 = x * rotCosY + z * rotSinY;
                const z1 = -x * rotSinY + z * rotCosY;

                const y2 = y * rotCosX - z1 * rotSinX;
                const z2 = y * rotSinX + z1 * rotCosX;

                const zDist = z2 + 620;
                if (zDist <= 25) return null;

                const scale = fov / zDist;
                return {
                    x: cx + x1 * scale,
                    y: cy + y2 * scale,
                    depth: zDist
                };
            }

            // 核心参数化设置：流线簇与横向张力环
            const streamCount = 52;
            const ptsPerStream = 84;
            const ringSteps = 16;

            let startTime = performance.now();
            let lastFrameTime = 0;

            function render(now) {
                animId = requestAnimationFrame(render);

                if (now - lastFrameTime < 16) return;
                lastFrameTime = now;

                const t = (now - startTime) * 0.00085;

                // 自主平滑旋转
                rotX += (targetRotX - rotX) * 0.06;
                rotY += (targetRotY - rotY) * 0.06;
                if (!isPointerInteracting) {
                    targetRotY += 0.0018;
                    targetRotX = 0.22 + Math.sin(t * 0.35) * 0.12;
                }

                ctx.clearRect(0, 0, w, h);

                const rotCosX = Math.cos(rotX);
                const rotSinX = Math.sin(rotX);
                const rotCosY = Math.cos(rotY);
                const rotSinY = Math.sin(rotY);

                // 线条组中心：桌面端略偏向右侧以和大文字形成瑞士网格负空间对冲
                const cx = w > 1024 ? w * 0.62 : w * 0.5;
                const cy = h * 0.5;

                // 连续变幻的调和波系数 (无需点击触发，随时间连续呼吸演进)
                const waveA = Math.sin(t * 0.38);
                const waveB = Math.cos(t * 0.27);
                const waveC = Math.sin(t * 0.19);
                const waveD = Math.cos(t * 0.44);

                // 生成网格顶点
                const grid = [];
                for (let i = 0; i < streamCount; i++) {
                    const v = (i / streamCount) * Math.PI * 2;
                    const row = [];
                    for (let j = 0; j <= ptsPerStream; j++) {
                        const u = (j / ptsPerStream) * Math.PI * 2;

                        // 持续演进的动态双环曲面方程
                        const rMain = 185 + waveA * 55 + Math.sin(u * 2 + t * 0.9) * 45 + waveC * 30 * Math.cos(v * 2);
                        const rCross = 72 + waveB * 30 + Math.cos(v * 3 - t * 0.7) * 26 + waveD * 18 * Math.sin(u * 3);

                        const twist = u * 2 + v + t * 0.52;
                        const px = (rMain + rCross * Math.cos(twist)) * Math.cos(u + t * 0.14);
                        const py = (rMain + rCross * Math.cos(twist)) * Math.sin(u + t * 0.14) * 0.82 + Math.sin(u * 3 + t * 0.75) * 38;
                        const pz = rCross * Math.sin(twist) * 2.2 + Math.cos(u * 2 + t * 0.45) * 60;

                        const proj = project(px, py, pz, rotCosX, rotSinX, rotCosY, rotSinY, cx, cy);
                        row.push(proj);
                    }
                    grid.push(row);
                }

                // 1. 渲染连续纵向流动线 (Streams)
                for (let i = 0; i < streamCount; i++) {
                    const row = grid[i];
                    let avgZ = 0;
                    let validCount = 0;
                    for (let j = 0; j < row.length; j++) {
                        if (row[j]) {
                            avgZ += row[j].depth;
                            validCount++;
                        }
                    }
                    if (validCount === 0) continue;
                    avgZ /= validCount;

                    // 深度感知色彩与透射衰减
                    const depthFactor = Math.max(0.08, Math.min(1, 1 - (avgZ - 280) / 660));
                    const ratio = i / streamCount;

                    ctx.beginPath();
                    let hasStarted = false;
                    for (let j = 0; j < row.length; j++) {
                        const pt = row[j];
                        if (pt) {
                            if (!hasStarted) {
                                ctx.moveTo(pt.x, pt.y);
                                hasStarted = true;
                            } else {
                                ctx.lineTo(pt.x, pt.y);
                            }
                        }
                    }

                    if (ratio < 0.4) {
                        ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 + depthFactor * 0.55})`;
                    } else if (ratio < 0.65) {
                        ctx.strokeStyle = `rgba(244, 114, 182, ${0.12 + depthFactor * 0.5})`;
                    } else {
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.08 + depthFactor * 0.4})`;
                    }
                    ctx.lineWidth = 0.95 * depthFactor + 0.35;
                    ctx.stroke();
                }

                // 2. 渲染横向张力环线 (Connecting Ribs)
                const ribInterval = Math.floor(ptsPerStream / ringSteps);
                for (let k = 0; k < ringSteps; k++) {
                    const j = k * ribInterval;
                    ctx.beginPath();
                    let hasStarted = false;
                    for (let i = 0; i <= streamCount; i++) {
                        const pt = grid[i % streamCount][j];
                        if (pt) {
                            if (!hasStarted) {
                                ctx.moveTo(pt.x, pt.y);
                                hasStarted = true;
                            } else {
                                ctx.lineTo(pt.x, pt.y);
                            }
                        }
                    }
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
                    ctx.lineWidth = 0.75;
                    ctx.stroke();
                }
            }

            resize();
            animId = requestAnimationFrame(render);
        })();
    </script>
</body>
