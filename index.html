        .bgm-bars {

        .bgm-bar {

        .bgm-btn.is-playing .bgm-bar:nth-child(1) { animation: eqB1 0.8s infinite alternate ease-in-out; }
        .bgm-btn.is-playing .bgm-bar:nth-child(2) { animation: eqB2 1.1s infinite alternate ease-in-out 0.2s; }

        @keyframes eqB1 { 0% { height: 2px; } 100% { height: 10px; } }

    <!-- 配乐源 -->
    <audio id="bgm" loop preload="auto">
        <source src="assets/audio/how-to-sekai-seifuku.mp3" type="audio/mpeg">
        <source src="https://archive.org/download/Sekai-Seifuku/14%20%E3%83%8F%E3%82%A6%E3%83%88%E3%82%A5%E3%83%BC%E4%B8%96%E7%95%8C%E5%BE%81%E6%9C%8D.mp3" type="audio/mpeg">
    </audio>

    <script>
        // BGM 播放器交互逻辑
        (function() {
            const btn = document.getElementById('bgmToggle');
            const audio = document.getElementById('bgm');
            if (!btn || !audio) return;
            let playing = false;
            btn.addEventListener('click', function() {
                if (!playing) {
                    audio.play().then(() => {
                        playing = true;
                        btn.classList.add('is-playing');
                    }).catch(() => {});
                } else {
                    audio.pause();
                    playing = false;
                    btn.classList.remove('is-playing');
                }
            });
        })();
    </script>
