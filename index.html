<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRJprogram · Projects Hub</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='m10 15 5-3-5-3v6Z'/></svg>">
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #090d16;
            --bg-card: rgba(17, 24, 39, 0.65);
            --bg-card-hover: rgba(22, 32, 51, 0.85);
            --border-card: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius-card: 14px;
            --radius-pill: 9999px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* 极简背景氛围光斑 */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
        }
        .glow-1 {
            width: 460px;
            height: 460px;
            background: radial-gradient(circle, #e11d48 0%, transparent 70%);
            top: -120px;
            left: -100px;
        }
        .glow-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #0284c7 0%, transparent 70%);
            bottom: -100px;
            right: -80px;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* 顶部导航 */
        .header-bar {
            padding: 24px 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 28px;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
        }
        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #fff;
        }
        .brand-text {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.01em;
        }
        .header-links a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: var(--transition);
        }
        .header-links a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
        }

        /* 纵向列表式卡片容器 */
        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 48px;
        }

        /* 单个项目卡片 - 整体可点击进入，横向紧凑布局 */
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-card);
            padding: 22px 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            transition: var(--transition);
        }
        .project-card:hover {
            transform: translateY(-2px);
            background: var(--bg-card-hover);
        }
        .project-card.fantasy-card:hover {
            border-color: rgba(244, 63, 94, 0.35);
            box-shadow: 0 10px 30px -10px rgba(225, 29, 72, 0.18);
        }
        .project-card.chem-card:hover {
            border-color: rgba(56, 189, 248, 0.35);
            box-shadow: 0 10px 30px -10px rgba(56, 189, 248, 0.18);
        }
        .project-card.chemiation-card:hover {
            border-color: rgba(168, 85, 247, 0.35);
            box-shadow: 0 10px 30px -10px rgba(168, 85, 247, 0.18);
        }

        /* 左侧彩色指示条 */
        .card-accent-bar {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
        }
        .fantasy-card .card-accent-bar {
            background: #f43f5e;
        }
        .chem-card .card-accent-bar {
            background: #38bdf8;
        }
        .chemiation-card .card-accent-bar {
            background: #a855f7;
        }

        /* 项目图标 */
        .card-icon {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
        }
        .fantasy-card .card-icon {
            background: rgba(225, 29, 72, 0.12);
            color: #fb7185;
            border: 1px solid rgba(225, 29, 72, 0.2);
        }
        .chem-card .card-icon {
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .chemiation-card .card-icon {
            background: rgba(168, 85, 247, 0.12);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        /* 内容区 */
        .card-body {
            flex: 1;
            min-width: 0;
        }
        .card-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .card-title {
            font-size: 1.18rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.01em;
        }
        .category-tag {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
        }
        .fantasy-card .category-tag {
            background: rgba(225, 29, 72, 0.12);
            color: #fda4af;
            border: 1px solid rgba(225, 29, 72, 0.2);
        }
        .chem-card .category-tag {
            background: rgba(56, 189, 248, 0.12);
            color: #7dd3fc;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .chemiation-card .category-tag {
            background: rgba(168, 85, 247, 0.12);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.88rem;
            line-height: 1.55;
            margin-bottom: 10px;
        }

        /* 快捷轻量文本链接（非大按钮） */
        .card-sublinks {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 0.82rem;
        }
        .card-sublinks a {
            color: var(--text-dim);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
        }
        .card-sublinks a:hover {
            color: #fff;
        }
        .card-sublinks .sep {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.75rem;
        }

        /* 卡片右侧进入小箭头指示 */
        .card-arrow {
            flex-shrink: 0;
            color: var(--text-dim);
            font-size: 0.95rem;
            transition: var(--transition);
            padding-left: 8px;
        }
        .project-card:hover .card-arrow {
            color: #fff;
            transform: translateX(3px);
        }

        /* 响应式调整 */
        @media (max-width: 640px) {
            .project-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
                padding: 18px 18px;
            }
            .card-arrow {
                display: none;
            }
            .card-sublinks {
                gap: 10px;
            }
        }

        /* 极简页脚 */
        .site-footer {
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding: 24px 0;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.82rem;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="container">
        <!-- 头部简洁栏 -->
        <header class="header-bar">
            <a href="index.html" class="brand-logo">
                <span class="brand-text">XRJprogram</span>
            </a>
            <div class="header-links">
                <a href="https://github.com/XRJprogram" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-github"></i> GitHub
                </a>
            </div>
        </header>

        <!-- 纵向排布项目列表 -->
        <main class="projects-list">
            <!-- 1. FantasyCity -->
            <div class="project-card fantasy-card">
                <div class="card-accent-bar"></div>
                <div class="card-icon">
                    <i class="fas fa-feather-pointed"></i>
                </div>
                <div class="card-body">
                    <div class="card-title-row">
                        <a href="FantasyCity/index.html" class="card-title smart-link" data-path="FantasyCity/index.html">FantasyCity 幻想城</a>
                        <span class="category-tag">奇幻世界 小说与同人游戏</span>
                    </div>
                    <p class="card-desc">巨大能量场笼罩下的异能世界观体系。包含原创长篇小说连载、法则设定图鉴与像素风卡牌探索游戏。</p>
                    <div class="card-sublinks">
                        <a href="FantasyCity/index.html" class="smart-link" data-path="FantasyCity/index.html"><i class="fas fa-arrow-up-right-from-square"></i> 进入门户</a>
                        <span class="sep">/</span>
                        <a href="FantasyCity/novel.html" class="smart-link" data-path="FantasyCity/novel.html">小说</a>
                        <span class="sep">/</span>
                        <a href="FantasyCity/games.html" class="smart-link" data-path="FantasyCity/games.html">游戏</a>
                        <span class="sep">/</span>
                        <a href="FantasyCity/lore.html" class="smart-link" data-path="FantasyCity/lore.html">设定</a>
                        <span class="sep">/</span>
                        <a href="https://github.com/XRJprogram/FantasyCity" target="_blank" rel="noopener noreferrer">源码</a>
                    </div>
                </div>
                <div class="card-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>

            <!-- 2. AnyChem -->
            <div class="project-card chem-card">
                <div class="card-accent-bar"></div>
                <div class="card-icon">
                    <i class="fas fa-atom"></i>
                </div>
                <div class="card-body">
                    <div class="card-title-row">
                        <a href="Anychem-pro/dist/index.html" class="card-title smart-link" data-path="Anychem-pro/dist/index.html">AnyChem Pro</a>
                        <span class="category-tag">化学建模</span>
                    </div>
                    <p class="card-desc">基于弹簧质点物理力学的 3D 分子空间构型交互建模系统，支持键位推演、官能团替换与反应推演脚本。</p>
                    <div class="card-sublinks">
                        <a href="Anychem-pro/dist/index.html" class="smart-link" data-path="Anychem-pro/dist/index.html"><i class="fas fa-arrow-up-right-from-square"></i> 启动建模</a>
                        <span class="sep">/</span>
                        <a href="Anychem-pro/index.html" class="smart-link" data-path="Anychem-pro/index.html">主页</a>
                        <span class="sep">/</span>
                        <a href="https://github.com/XRJprogram/Anychem-pro/blob/main/README-cn.md" target="_blank" rel="noopener noreferrer">中文文档</a>
                        <span class="sep">/</span>
                        <a href="https://github.com/XRJprogram/Anychem-pro" target="_blank" rel="noopener noreferrer">源码</a>
                    </div>
                </div>
                <div class="card-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>

            <!-- 3. Chemiation -->
            <div class="project-card chemiation-card">
                <div class="card-accent-bar"></div>
                <div class="card-icon">
                    <i class="fas fa-flask-vial"></i>
                </div>
                <div class="card-body">
                    <div class="card-title-row">
                        <a href="Chemiation/index.html" class="card-title smart-link" data-path="Chemiation/index.html">Chemiation</a>
                        <span class="category-tag">化学反应原理</span>
                    </div>
                    <p class="card-desc"> 3D纵深的化学反应微观机理推演工坊</p>
                    <div class="card-sublinks">
                        <a href="Chemiation/index.html" class="smart-link" data-path="Chemiation/index.html"><i class="fas fa-arrow-up-right-from-square"></i> 启动推演</a>
                        <span class="sep">/</span>
                        <a href="Chemiation/docs.html" class="smart-link" data-path="Chemiation/docs.html">语法手册</a>
                        <span class="sep">/</span>
                        <a href="https://github.com/XRJprogram/Chemiation" target="_blank" rel="noopener noreferrer">源码</a>
                    </div>
                </div>
                <div class="card-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </main>
    </div>

    <!-- 极简页脚 -->
    <footer class="site-footer">
        <div class="container">
            <p>© 2026 XRJprogram · GitHub Pages</p>
        </div>
    </footer>

    <!-- 智能链接跳转自适应 (自动适配本地双击打开与线上 GitHub Pages) -->
    <script>
        (function adaptLinks() {
            if (window.location.protocol === 'file:') {
                document.querySelectorAll('.smart-link').forEach(link => {
                    const targetPath = link.getAttribute('data-path');
                    if (targetPath) {
                        link.setAttribute('href', '../' + targetPath);
                    }
                });
            }
        })();
    </script>
</body>
</html>
