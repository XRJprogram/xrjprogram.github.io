<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRJprogram · 个人项目矩阵与作品展</title>
    <meta name="description" content="XRJprogram 个人主页与技术作品展：AnyChem Pro 分子动力学模拟、BitPulse 8-Bit 音乐发生器、Chemiation 化学反应演示、PixelMe 像素角色捏脸、littlesc Scratch 积木代码生成、Gif Editor QQ 表情衍生工坊、Lambda Diagrams 极简图示工作台，以及 FantasyCity 幻想城。">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>">
    
    <!-- Google Fonts & FontAwesome 6 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cinzel:wght@700;900&family=Space+Grotesk:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ============================================================
           设计规范：专属色彩体系与完备中文字体回退矩阵 (兼顾在线与离线环境)
           ============================================================ */
        :root {
            --bg-cosmos: #030611;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.45);

            /* Anychem-pro 真实源码色相：鼠尾草绿、深灰玄武岩 */
            --anychem-accent: #9fb48d;
            --anychem-bg: #090c0e;
            --anychem-surface: #10161a;

            /* BitPulse 真实源码色相：NES 2A03 示波器荧光绿、碳晶黑 */
            --bitpulse-green: #10b981;
            --bitpulse-mint: #34d399;
            --bitpulse-dark: #09090b;

            /* Chemiation 真实源码色相：深棕学术质感、反应活性赭红、能量跃迁金 */
            --chemiation-ochre: #b84a28;
            --chemiation-gold: #c08a3e;
            --chemiation-dark: #140b06;

            /* PixelMe 真实源码色相：鸢尾花紫、赛博青、高光粉、复古明黄 */
            --pixelme-iris: #6c5ce7;
            --pixelme-cyan: #00cec9;
            --pixelme-pink: #fd79a8;
            --pixelme-yellow: #ffeaa7;
            --pixelme-dark: #120e24;

            /* littlesc 真实源码色相：Scratch 3.0 事件橙、引擎蓝、Diff 翠绿 */
            --littlesc-orange: #ffab19;
            --littlesc-blue: #4c97ff;
            --littlesc-diff: #0fbd8c;
            --littlesc-dark: #16161a;

            /* GifEditor 真实源码色相：UE5 Slate 蓝图青、节点金、暗夜 Slate */
            --gifeditor-cyan: #38bdf8;
            --gifeditor-amber: #f59e0b;
            --gifeditor-glow: rgba(56, 189, 248, 0.4);
            --gifeditor-dark: #070d18;

            /* LambdaDiagrams 真实源码色相：纯黑白极简主义、高对比度电路拓扑 */
            --lambda-bg: #000000;
            --lambda-white: #ffffff;
            --lambda-muted: #888888;
            --lambda-border: rgba(255, 255, 255, 0.4);
            --lambda-glow: rgba(255, 255, 255, 0.18);

            /* 东方宣纸淡黄色底蕴与朱砂印泥 */
            --paper-pale-yellow: #faf6e9;
            --fc-seal: #c0392b;
            --fc-gold: #a67c1e;
            --fc-dark-ink: #1a110b;

            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-cinema: 'Cinzel', 'Noto Serif SC', 'Songti SC', 'STSong', '华文宋体', 'SimSun', '宋体', serif;
            --font-display: 'Space Grotesk', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Consolas', monospace;
            --font-calligraphy: 'Ma Shan Zheng', 'STXingkai', '华文行楷', 'FZXingKai-S04S', 'STKaiti', '华文楷体', 'KaiTi', '楷体', 'SimSun', '宋体', cursive, serif;
            --font-song: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', '华文宋体', 'SimSun', '宋体', serif;
            --font-sans-cn: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', 'SimHei', '黑体', sans-serif;
            --font-pixel: 'Press Start 2P', monospace;

            --radius-pill: 9999px;
            --transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ============================================================
           全浏览器原生滚动条消除 (隐藏默认三角箭头、生硬滑块，全平台统一样式)
           ============================================================ */
        html {
            scrollbar-width: none !important; /* Firefox 隐藏原生滚动条 */
            -ms-overflow-style: none !important; /* IE / 旧版 Edge 隐藏原生滚动条 */
            scroll-behavior: auto; /* 由平滑阻尼滚轮引擎精准接管，避免原声碰撞冲突 */
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        /* ============================================================
           专属右侧长圆柱胶囊滚动条 (纯长圆柱、无任何上下箭头、全浏览器统一响应)
           ============================================================ */
        .custom-scrollbar {
            position: fixed;
            top: 0;
            right: 4px;
            width: 14px;
            height: 100vh;
            z-index: 99999;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }
        .custom-scroll-track {
            position: relative;
            width: 100%;
            height: calc(100vh - 24px);
            margin-top: 12px;
            pointer-events: auto;
            cursor: pointer;
        }
        /* 纯正现代单一长圆柱胶囊滑块：单一圆柱、彻底无嵌套内芯、无上下箭头 */
        .custom-scroll-thumb {
            position: absolute;
            top: 0;
            right: 3px;
            width: 7px;
            min-height: 64px; /* 唯一一个长圆柱胶囊形态 */
            border-radius: 9999px; /* 极简现代单一长圆柱 */
            background: var(--custom-scroll-color, rgba(148, 163, 184, 0.5));
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
            cursor: grab;
            transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s ease, box-shadow 0.25s ease;
            will-change: transform;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .custom-scroll-thumb:hover,
        .custom-scroll-thumb.is-dragging {
            width: 10px;
            cursor: grabbing;
            background: var(--custom-scroll-hover, #38bdf8);
            box-shadow: 0 0 14px var(--custom-scroll-glow, rgba(56, 189, 248, 0.55));
        }
        @media (max-width: 768px) {
            .custom-scrollbar {
                display: none !important;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans-cn);
            background-color: var(--bg-cosmos);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* 星空背景 Canvas */
        #cosmos-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.92;
        }

        /* ============================================================
           页眉：固定悬浮顶栏（左侧 XRJPROGRAM，右侧 GitHub）
           纯 fixed 悬浮，不占垂直文档流空间，绝不挤压卡片！
           向下滑动时文字颜色平滑过渡为墨色，确保在淡黄色宣纸上清晰醒目
           ============================================================ */
        .floating-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 24px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }
        .nav-brand {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 0.18em;
            text-decoration: none;
            color: #ffffff;
            pointer-events: auto;
            transition: transform 0.3s ease;
        }
        .nav-brand:hover {
            transform: scale(1.03);
        }
        .nav-github {
            font-size: 1.3rem;
            color: #94a3b8;
            text-decoration: none;
            pointer-events: auto;
            transition: transform 0.3s ease, color 0.3s ease;
            display: flex;
            align-items: center;
        }
        .nav-github:hover {
            color: #fff;
            transform: scale(1.1);
        }

        /* ============================================================
           首屏：完全消除卡片上方的一切标题与占位！
           整屏 100vh 垂直居中铺满视口，打开网页第一眼直接沉浸进入 3D 卡牌空间
           ============================================================ */
        .first-screen-hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 0 24px;
        }

        .spatial-deck-stage {
            position: relative;
            width: 100%;
            height: 460px;
            margin-bottom: 30px;
            perspective: 1600px;
            perspective-origin: 50% 50%;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }
        .spatial-deck-stage:active {
            cursor: grabbing;
        }

        /* 16:9 电影海报卡牌基础容器 (660px × 372px) */
        .poster-artifact-card {
            position: absolute;
            width: 660px;
            height: 372px;
            border-radius: 20px;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            transform-style: preserve-3d;
            will-change: transform, opacity, filter;
            box-shadow: 0 40px 95px -25px rgba(0, 0, 0, 0.95);
            transition: box-shadow 0.4s ease, border-color 0.4s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 36px 42px;
        }

        .poster-top-row {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            transform: translateZ(35px);
        }

        .poster-center-body {
            position: relative;
            z-index: 2;
            margin-top: auto;
            margin-bottom: auto;
            transform: translateZ(45px);
        }

        .poster-bottom-row {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            transform: translateZ(35px);
        }

        /* -------------------------------------------------------------
           核心项目各自独特的个性化字体与装置视觉设计（汉字字体全面适配）
           ------------------------------------------------------------- */

        /* 01. ANYCHEM PRO: 鼠尾草绿与玄武岩分子力学天体仪 (#9fb48d / #10161a) */
        .card-anychem {
            background: radial-gradient(circle at 75% 25%, #152219 0%, #0c1410 50%, #060a08 100%);
            border: 1px solid rgba(159, 180, 141, 0.45);
        }
        .card-bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            border-radius: inherit;
        }
        .card-anychem .chem-grid-wireframe {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: 28px 28px;
            background-image: 
                linear-gradient(to right, rgba(159, 180, 141, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(159, 180, 141, 0.06) 1px, transparent 1px);
            pointer-events: none;
            z-index: 0;
        }
        .card-anychem .card-bg-canvas {
            opacity: 0.95;
            z-index: 1;
        }
        .card-chemiation .card-bg-canvas {
            opacity: 0.95;
            z-index: 1;
        }
        .title-chem {
            font-family: var(--font-cinema);
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: #fff;
            line-height: 1.1;
            margin-bottom: 6px;
            text-shadow: 0 0 35px rgba(159, 180, 141, 0.55);
        }
        .sub-chem {
            font-family: var(--font-sans-cn);
            font-weight: 700;
            font-size: 1.08rem;
            color: var(--anychem-accent);
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }
        .desc-chem {
            font-family: var(--font-sans-cn);
            font-weight: 400;
            font-size: 0.9rem;
            line-height: 1.7;
            max-width: 520px;
            color: #d1dcce;
        }

        /* 02. BITPULSE: NES 2A03 荧光绿与碳晶黑复古芯片工作站 (#10b981 / #09090b) */
        .card-bitpulse {
            background: linear-gradient(135deg, #021a11 0%, #010f0a 60%, #000705 100%);
            border: 2px solid var(--bitpulse-green);
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.22);
        }
        .card-bitpulse .crt-lines-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.45) 0px, rgba(0, 0, 0, 0.45) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            z-index: 1;
        }
        .card-bitpulse .cartridge-gold-pins {
            position: absolute;
            top: 24px; bottom: 24px; right: 0;
            width: 14px;
            background: repeating-linear-gradient(180deg, #f59e0b 0px, #f59e0b 8px, #78350f 8px, #78350f 14px);
            border-left: 2px solid #000;
            opacity: 0.75;
            pointer-events: none;
            overflow: hidden;
        }
        .card-bitpulse .cartridge-gold-pins::after {
            content: '';
            position: absolute;
            top: -40%; left: 0; right: 0; height: 40%;
            background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.65), transparent);
            animation: goldPinShine 3.5s ease-in-out infinite;
        }
        @keyframes goldPinShine {
            0%, 30% { top: -40%; opacity: 0; }
            50% { opacity: 1; }
            80%, 100% { top: 120%; opacity: 0; }
        }
        .title-bit {
            font-family: var(--font-pixel);
            font-size: 2.1rem;
            color: var(--bitpulse-green);
            text-shadow: 0 0 25px rgba(16, 185, 129, 0.85);
            letter-spacing: 0.06em;
            line-height: 1.2;
            margin-bottom: 10px;
        }
        .sub-bit {
            font-family: var(--font-sans-cn);
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--bitpulse-mint);
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }
        .desc-bit {
            font-family: var(--font-sans-cn);
            font-weight: 400;
            font-size: 0.9rem;
            line-height: 1.7;
            max-width: 500px;
            color: #a7f3d0;
        }
        .bit-equalizer-bars {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 24px;
        }
        .bit-bar-pip {
            width: 6px;
            background: var(--bitpulse-green);
            border-radius: 1px;
            box-shadow: 0 0 8px var(--bitpulse-green);
            animation: liveWave 1.1s ease-in-out infinite alternate;
        }
        @keyframes liveWave {
            0% { height: 20%; opacity: 0.35; }
            100% { height: 100%; opacity: 1; }
        }

        /* 03. CHEMIATION: 反应活性赭红与古朴深棕学术机理室 (#b84a28 / #c08a3e / #140b06) */
        .card-chemiation {
            background: radial-gradient(circle at 75% 25%, #34180d 0%, #1c0d06 50%, #0a0402 100%);
            border: 1px solid rgba(184, 74, 40, 0.55);
            box-shadow: 0 0 45px rgba(184, 74, 40, 0.22);
        }
        .card-chemiation .chem-parchment-glow {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 80% 20%, rgba(192, 138, 62, 0.22) 0%, transparent 55%);
            pointer-events: none;
            filter: blur(20px);
            animation: chemGlowPulse 5s ease-in-out infinite alternate;
        }
        @keyframes chemGlowPulse {
            0% { opacity: 0.55; transform: scale(0.96); }
            100% { opacity: 0.95; transform: scale(1.06); }
        }
        .pes-barrier-tag {
            display: inline-block;
            animation: pesPulse 2.4s ease-in-out infinite alternate;
        }
        @keyframes pesPulse {
            0% { text-shadow: 0 0 6px rgba(192, 138, 62, 0.4); }
            100% { text-shadow: 0 0 16px rgba(192, 138, 62, 0.95), 0 0 28px rgba(184, 74, 40, 0.6); }
        }
        .title-chemia {
            font-family: var(--font-cinema);
            font-size: 2.7rem;
            font-weight: 900;
            letter-spacing: 0.22em;
            color: #faf6e9;
            line-height: 1.1;
            margin-bottom: 6px;
            text-shadow: 0 0 35px rgba(184, 74, 40, 0.8);
        }
        .sub-chemia {
            font-family: var(--font-song);
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--chemiation-gold);
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }
        .desc-chemia {
            font-family: var(--font-song);
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.75;
            max-width: 520px;
            color: #ecdccb;
        }

        /* 04. PIXELME: 鸢尾花紫与街机点阵纸娃娃工坊 (#6c5ce7 / #00cec9 / #fd79a8) */
        .card-pixelme {
            background: linear-gradient(135deg, #1b1333 0%, #0e091c 60%, #06040c 100%);
            border: 2px solid var(--pixelme-iris);
            box-shadow: 0 0 45px rgba(108, 92, 231, 0.25);
        }
        .card-pixelme .arcade-grid-mesh {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: 18px 18px;
            background-image: 
                linear-gradient(to right, rgba(108, 92, 231, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(108, 92, 231, 0.1) 1px, transparent 1px);
            pointer-events: none;
            animation: gridDrift 24s linear infinite;
        }
        @keyframes gridDrift {
            0% { background-position: 0 0; }
            100% { background-position: 18px 18px; }
        }
        .title-pix {
            font-family: var(--font-pixel);
            font-size: 2.1rem;
            color: #fff;
            letter-spacing: 0.06em;
            line-height: 1.2;
            margin-bottom: 10px;
            text-shadow: 4px 4px 0 var(--pixelme-iris), 0 0 25px rgba(108, 92, 231, 0.7);
        }
        .sub-pix {
            font-family: var(--font-sans-cn);
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--pixelme-pink);
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }
        .desc-pix {
            font-family: var(--font-sans-cn);
            font-weight: 400;
            font-size: 0.9rem;
            line-height: 1.7;
            max-width: 520px;
            color: #e9e5ff;
        }
        .pix-swatches-strip {
            display: flex;
            gap: 8px;
        }
        .pix-dot {
            width: 12px;
            height: 12px;
            border: 1px solid #000;
            box-shadow: 1px 1px 0 rgba(108, 92, 231, 0.6);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card-pixelme:hover .pix-dot:nth-child(1) { transform: translateY(-5px); transition-delay: 0.04s; }
        .card-pixelme:hover .pix-dot:nth-child(2) { transform: translateY(-5px); transition-delay: 0.08s; }
        .card-pixelme:hover .pix-dot:nth-child(3) { transform: translateY(-5px); transition-delay: 0.12s; }
        .card-pixelme:hover .pix-dot:nth-child(4) { transform: translateY(-5px); transition-delay: 0.16s; }

        /* 05. LITTLESC: TurboWarp 积木事件橙与 AST 编译器 (#ffab19 / #4c97ff / #0fbd8c) */
        .card-littlesc {
            background: linear-gradient(135deg, #241403 0%, #120901 60%, #060300 100%);
            border: 1px solid rgba(255, 171, 25, 0.5);
            box-shadow: 0 0 45px rgba(255, 171, 25, 0.2);
        }
        .title-sc {
            font-family: var(--font-display);
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            color: #fff;
            line-height: 1.1;
            margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(255, 171, 25, 0.6);
        }
        .title-sc span {
            color: var(--littlesc-orange);
        }
        .sub-sc {
            font-family: var(--font-sans-cn);
            font-weight: 700;
            font-size: 1.06rem;
            color: var(--littlesc-orange);
            letter-spacing: 0.08em;

        /* ============================================================
           定制化个性字体与 SVG Wordmark 艺术字排版系统
           ============================================================ */
        .title-chem-wrap,
        .title-bit-wrap,
        .title-chemia-wrap,
        .title-pix-wrap,
        .title-sc-wrap,
        .title-gif-wrap,
        .title-lambda-wrap {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .title-chem-svg,
        .title-bit-svg,
        .title-chemia-svg,
        .title-pix-svg,
        .title-sc-svg,
        .title-gif-svg,
        .title-lambda-svg {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: 48px;
            overflow: visible;
        }

        /* 01. AnyChem SVG */
        .chem-svg-text {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 0.1em;
            fill: #ffffff;
            filter: drop-shadow(0 0 16px rgba(159, 180, 141, 0.5));
        }
        .chem-pro-text {
            font-family: var(--font-mono);
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 0.15em;
            fill: var(--anychem-accent);
        }

        /* 02. BitPulse SVG */
        .bit-svg-text {
            font-family: var(--font-pixel);
            font-size: 20px;
            letter-spacing: 0.08em;
            fill: #ffffff;
            filter: drop-shadow(3px 3px 0 #059669) drop-shadow(0 0 20px rgba(16, 185, 129, 0.8));
        }
        .bit-cursor-blink {
            animation: bitCursorSmooth 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes bitCursorSmooth {
            0%, 100% {
                opacity: 0.95;
                filter: drop-shadow(0 0 6px var(--bitpulse-mint));
            }
            50% {
                opacity: 0.15;
                filter: drop-shadow(0 0 1px transparent);
            }
        }

        /* 03. Chemiation SVG */
        .chemia-svg-text {
            font-family: var(--font-cinema);
            font-weight: 900;
            font-size: 27px;
            letter-spacing: 0.22em;
            fill: #faf6e9;
            filter: drop-shadow(0 0 25px rgba(184, 74, 40, 0.8));
        }
        .chemia-dagger-text {
            font-family: var(--font-cinema);
            font-size: 20px;
            font-weight: 700;
            fill: var(--chemiation-gold);
            filter: drop-shadow(0 0 10px rgba(192, 138, 62, 0.8));
        }

        /* 04. PixelMe SVG */
        .pix-svg-text {
            font-family: var(--font-pixel);
            font-size: 21px;
            letter-spacing: 0.08em;
            fill: #ffffff;
        }
        .pix-svg-shadow-cyan {
            font-family: var(--font-pixel);
            font-size: 21px;
            letter-spacing: 0.08em;
            fill: var(--pixelme-cyan);
        }
        .pix-svg-shadow-pink {
            font-family: var(--font-pixel);
            font-size: 21px;
            letter-spacing: 0.08em;
            fill: var(--pixelme-pink);
            filter: drop-shadow(0 0 16px rgba(253, 121, 168, 0.7));
        }

        /* 05. LittleSC SVG */
        .sc-svg-text {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 0.05em;
            fill: #ffffff;
            filter: drop-shadow(0 0 20px rgba(255, 171, 25, 0.45));
        }

        /* 06. Gif Editor SVG */
        .gif-svg-main {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 27px;
            letter-spacing: 0.08em;
            fill: #ffffff;
            filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.6));
        }
        .gif-svg-badge {
            font-family: var(--font-mono);
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 0.16em;
            fill: var(--gifeditor-cyan);
        }

        /* 07. Lambda Diagrams SVG */
        .lambda-svg-title {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 26px;
            letter-spacing: 0.08em;
            fill: #ffffff;
            filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.5));
        }
        .lambda-svg-sub {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.14em;
            fill: #a3a3a3;
        }

        /* 空间滑轨极简指示器 (极简长圆柱胶囊) */
        .stage-indicator-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }
        .deck-indicator-pill {
            height: 4px;
            width: 32px;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.16);
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .deck-indicator-pill.active {
            width: 68px;
            background: var(--primary);
            box-shadow: 0 0 16px var(--primary-glow);
            animation: pillGlowPulse 2.2s ease-in-out infinite alternate;
        }
        @keyframes pillGlowPulse {
            0% { box-shadow: 0 0 10px var(--primary-glow); }
            100% { box-shadow: 0 0 24px var(--primary-glow), 0 0 38px rgba(56, 189, 248, 0.45); }
        }

        /* 首屏向下探索水墨画卷极简引导 */
        .scroll-down-hint {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        .scroll-hint-label {
            font-family: var(--font-song);
            font-size: 0.74rem;
            letter-spacing: 0.22em;
            color: rgba(255, 255, 255, 0.42);
            animation: hintTextBreath 3s ease-in-out infinite alternate;
        }
        @keyframes hintTextBreath {
            0% { opacity: 0.35; transform: translateY(0); }
            100% { opacity: 0.85; transform: translateY(-2px); }
        }
        .scroll-hint-track {
            width: 2px;
            height: 24px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }
        .scroll-hint-drop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(180deg, transparent, var(--primary));
            border-radius: 2px;
            animation: scrollDropFlow 2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
        @keyframes scrollDropFlow {
            0% { transform: translateY(-100%); opacity: 0; }
            30% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translateY(300%); opacity: 0; }
        }

        /* ============================================================
           东方水墨玄境：《FantasyCity 幻想城》
           向下滚动过程中，全局平滑无级过渡至淡黄色宣纸 (#FAF6E9)
           狂草笔画自三维吸附重聚为墨黑苍劲大字，朱砂古印盖落
           ============================================================ */
        .fantasycity-ink-realm {
            min-height: 100vh;
            padding: 130px 24px 120px;
            position: relative;
            overflow: visible;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 水墨气韵光环 */
        .ink-ambient-aura {
            position: absolute;
            width: 680px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(192, 57, 43, 0.1) 0%, rgba(36, 20, 11, 0.05) 45%, transparent 72%);
            filter: blur(45px);
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        .fantasycity-ink-realm.fc-entered .ink-ambient-aura {
            opacity: 1;
            animation: auraPulse 9s ease-in-out infinite alternate;
        }
        @keyframes auraPulse {
            0% { transform: scale(0.92) rotate(0deg); }
            100% { transform: scale(1.12) rotate(6deg); }
        }

        /* 宣纸金箔洒金浮光 (带顶部边缘羽化) */
        .gold-flakes-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 80px, rgba(0,0,0,1) calc(100% - 40px), transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 80px, rgba(0,0,0,1) calc(100% - 40px), transparent 100%);
        }
        .gold-leaf-flake {
            position: absolute;
            left: var(--l);
            top: var(--t);
            width: var(--s);
            height: var(--s);
            background: linear-gradient(135deg, #f59e0b, #d97706, #fbbf24);
            border-radius: 1px;
            opacity: 0.6;
            box-shadow: 0 0 6px rgba(245, 158, 11, 0.4);
            animation: goldSway var(--dur) ease-in-out infinite alternate var(--delay);
        }
        @keyframes goldSway {
            0% { transform: translateY(0) rotate(0deg) scale(0.9); opacity: 0.3; }
            50% { transform: translateY(-16px) translateX(8px) rotate(45deg) scale(1.2); opacity: 0.75; }
            100% { transform: translateY(-32px) translateX(-6px) rotate(90deg) scale(0.9); opacity: 0.4; }
        }

        /* 纯动态水墨烟云 Canvas (在淡黄色宣纸上晕染深黑墨迹，两端柔和羽化防切断) */
        #ink-fluid-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0;
            z-index: 0;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 120px, rgba(0,0,0,1) calc(100% - 60px), transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 120px, rgba(0,0,0,1) calc(100% - 60px), transparent 100%);
        }

        /* 樱花飘落动态 Canvas */
        #sakura-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        /* ============================================================
           现代新中式水墨长方体侧翼交织装置 (排列至视口两侧松散交织，中央纯净留白，绝不堆叠在文字下方)
           ============================================================ */
        .fc-ink-cuboid-stage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .ink-caution-tape {
            position: absolute;
            mix-blend-mode: multiply; /* 让真实墨迹与淡黄宣纸自然物理混色，水墨渗透纸纹 */
            will-change: clip-path, opacity;
            pointer-events: none;
            opacity: 0;
            transition: clip-path 1.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.9s ease;
        }

        .ink-caution-tape img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill;
            filter: contrast(1.08) drop-shadow(0 2px 6px rgba(36, 20, 11, 0.08));
        }

        /* --- 左侧侧翼松散交织笔画群 --- */
        .tape-left-1 {
            width: min(38vw, 520px);
            height: 38px;
            top: 26%;
            left: -50px;
            transform: rotate(-13deg);
            transform-origin: left center;
            clip-path: inset(0 100% 0 0);
            z-index: 3;
        }
        .tape-left-2 {
            width: min(34vw, 460px);
            height: 34px;
            top: 48%;
            left: -35px;
            transform: rotate(17deg);
            transform-origin: left center;
            clip-path: inset(0 100% 0 0);
            z-index: 4;
        }
        .tape-left-3 {
            width: min(28vw, 380px);
            height: 26px;
            top: 68%;
            left: -20px;
            transform: rotate(-7deg);
            transform-origin: left center;
            clip-path: inset(0 100% 0 0);
            z-index: 2;
        }

        /* --- 右侧侧翼松散交织笔画群 --- */
        .tape-right-1 {
            width: min(38vw, 500px);
            height: 36px;
            top: 22%;
            right: -50px;
            transform: rotate(14deg);
            transform-origin: right center;
            clip-path: inset(0 0 0 100%);
            z-index: 3;
        }
        .tape-right-2 {
            width: min(35vw, 450px);
            height: 32px;
            top: 46%;
            right: -35px;
            transform: rotate(-16deg);
            transform-origin: right center;
            clip-path: inset(0 0 0 100%);
            z-index: 4;
        }
        .tape-right-3 {
            width: min(29vw, 370px);
            height: 26px;
            top: 68%;
            right: -20px;
            transform: rotate(8deg);
            transform-origin: right center;
            clip-path: inset(0 0 0 100%);
            z-index: 2;
        }

        /* 激活时优雅舒展：左侧从外向内延展，右侧从外向内延展，层次错落有致 */
        .fantasycity-ink-realm.fc-entered .tape-left-1 {
            clip-path: inset(0 0% 0 0);
            opacity: 0.92;
            transition-delay: 0.08s;
        }
        .fantasycity-ink-realm.fc-entered .tape-left-2 {
            clip-path: inset(0 0% 0 0);
            opacity: 0.88;
            transition-delay: 0.24s;
        }
        .fantasycity-ink-realm.fc-entered .tape-left-3 {
            clip-path: inset(0 0% 0 0);
            opacity: 0.76;
            transition-delay: 0.38s;
        }

        .fantasycity-ink-realm.fc-entered .tape-right-1 {
            clip-path: inset(0 0 0 0%);
            opacity: 0.86;
            transition-delay: 0.16s;
        }
        .fantasycity-ink-realm.fc-entered .tape-right-2 {
            clip-path: inset(0 0 0 0%);
            opacity: 0.92;
            transition-delay: 0.32s;
        }
        .fantasycity-ink-realm.fc-entered .tape-right-3 {
            clip-path: inset(0 0 0 0%);
            opacity: 0.78;
            transition-delay: 0.46s;
        }

        @media (max-width: 1024px) {
            .tape-left-1, .tape-left-2, .tape-left-3,
            .tape-right-1, .tape-right-2, .tape-right-3 {
                opacity: 0.45 !important;
            }
        }

        @media (max-width: 768px) {
            .fc-ink-cuboid-stage {
                opacity: 0.35;
            }
            .tape-left-1 { width: 220px; height: 20px; top: 18%; left: -30px; }
            .tape-left-2 { width: 200px; height: 18px; top: 42%; left: -20px; }
            .tape-left-3 { width: 160px; height: 14px; top: 72%; left: -10px; }
            .tape-right-1 { width: 210px; height: 20px; top: 16%; right: -30px; }

    <!-- 核心交互逻辑：智能链接、防卡顿手势解耦 3D 引擎、草书笔画重聚与无级平滑向淡黄宣纸变色 -->
    <script>
        /* 1. 链接自适应 (本地 file: 与 GitHub Pages 在线环境双向兼容) */
        function resolveUrl(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            if (window.location.protocol === 'file:') {
                return '../' + url;
            }
            return url;
        }

        (function adaptSmartLinks() {
            document.querySelectorAll('.smart-link').forEach(link => {
                const targetPath = link.getAttribute('data-path');
                if (targetPath) {
                    link.setAttribute('href', resolveUrl(targetPath));
                }
            });
        })();

        /* 2. 3D 装置流物理引擎 (手势与点击严格解耦，彻底避免滑动卡死) */
        const DeckEngine = (function() {
            const stage = document.getElementById('deckStage');
            const indicatorBar = document.getElementById('indicatorBar');
            if (!stage) return null;

            const total = ARTIFACT_ITEMS.length;
            let currentPos = 0;
            let targetPos = 0;
            let activeIdx = 0;

            // 拖拽手势物理状态
            let isPointerDown = false;
            let startPointerX = 0;
            let startPos = 0;
            let lastPointerX = 0;
            let lastMoveTime = 0;
            let dragVelocity = 0;
            let hasMovedSignificantly = false;

            // 鼠标 3D 视差俯仰
            let mouseTiltX = 0;
            let mouseTiltY = 0;
            let curTiltX = 0;
            let curTiltY = 0;

            const cardElements = [];
            let renderAnychemMol = null;
            let renderChemiationStruct = null;

            function init() {
                stage.innerHTML = '';
                indicatorBar.innerHTML = '';

                ARTIFACT_ITEMS.forEach((item, i) => {
                    const card = document.createElement('div');
                    card.className = `poster-artifact-card ${item.customClass}`;
                    card.setAttribute('data-index', i);
                    card.innerHTML = item.innerMarkup;

                    // 禁用浏览器原生拖拽干扰
                    card.ondragstart = () => false;

                    // 点击卡片：若居中则直接进入项目，若在两侧则滑至中心
                    card.addEventListener('click', (e) => {
                        if (hasMovedSignificantly) return;
                        if (i === activeIdx) {
                            const targetUrl = resolveUrl(item.launchUrl);
                            if (item.launchUrl.startsWith('http')) {
                                window.open(targetUrl, '_blank', 'noopener,noreferrer');
                            } else {
                                window.location.href = targetUrl;
                            }
                        } else {
                            goTo(i);
                        }
                    });

                    stage.appendChild(card);
                    cardElements.push(card);

                    // 极简长圆柱指示条
                    const pill = document.createElement('div');
                    pill.className = 'deck-indicator-pill' + (i === 0 ? ' active' : '');
                    pill.addEventListener('click', () => goTo(i));
                    indicatorBar.appendChild(pill);
                });

                bindEvents();
                renderAnychemMol = initAnychemMoleculeSimulation();
                renderChemiationStruct = initChemiationStructureSimulation();
                requestAnimationFrame(renderLoop);
            }

            function getShortestDistance(fromIdx, toIdx) {
                let diff = (toIdx - fromIdx) % total;
                if (diff > total / 2) diff -= total;
                if (diff < -total / 2) diff += total;
                return diff;
            }

            function goTo(idx) {
                const diff = getShortestDistance(activeIdx, idx);
                targetPos += diff;
                activeIdx = idx;
                updateIndicators();
            }

            function next() {
                targetPos = Math.round(targetPos) + 1;
                activeIdx = ((Math.round(targetPos) % total) + total) % total;
                updateIndicators();
            }

            function prev() {
                targetPos = Math.round(targetPos) - 1;
                activeIdx = ((Math.round(targetPos) % total) + total) % total;
                updateIndicators();
            }

            function updateIndicators() {
                const pills = indicatorBar.querySelectorAll('.deck-indicator-pill');
                pills.forEach((p, i) => p.classList.toggle('active', i === activeIdx));
            }

            function bindEvents() {
                // 鼠标与触摸按下
                stage.addEventListener('pointerdown', (e) => {
                    isPointerDown = true;
                    hasMovedSignificantly = false;
                    startPointerX = e.clientX;
                    startPos = targetPos;
                    lastPointerX = e.clientX;
                    lastMoveTime = performance.now();
                    dragVelocity = 0;
                });

                window.addEventListener('pointermove', (e) => {
                    // 鼠标 3D 倾斜计算
                    const rect = stage.getBoundingClientRect();
                    if (e.clientY >= rect.top && e.clientY <= rect.bottom) {
                        mouseTiltX = ((e.clientY - (rect.top + rect.height / 2)) / (rect.height / 2)) * -8;
                        mouseTiltY = ((e.clientX - (rect.left + rect.width / 2)) / (rect.width / 2)) * 8;
                    }

                    if (!isPointerDown) return;
                    const deltaX = e.clientX - startPointerX;
                    if (Math.abs(deltaX) > 6) {
                        hasMovedSignificantly = true;
                    }

                    const cardWidth = window.innerWidth < 768 ? 260 : 380;
                    targetPos = startPos - (deltaX / cardWidth);

                    const now = performance.now();
                    const dt = now - lastMoveTime;
                    if (dt > 10) {
                        dragVelocity = (e.clientX - lastPointerX) / dt;
                        lastPointerX = e.clientX;
                        lastMoveTime = now;
                    }
                });

                const onPointerUp = () => {
                    if (!isPointerDown) return;
                    isPointerDown = false;

                    // 惯性对齐 (环形无锁，自由循环)
                    targetPos -= dragVelocity * 0.35;
                    targetPos = Math.round(targetPos);
                    activeIdx = ((targetPos % total) + total) % total;
                    updateIndicators();
                };

                window.addEventListener('pointerup', onPointerUp);
                window.addEventListener('pointercancel', onPointerUp);

                // 鼠标滚轮推演 (带缓冲锁防卡死)
                let wheelLock = false;
                stage.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    if (wheelLock) return;
                    if (Math.abs(e.deltaY) > 20 || Math.abs(e.deltaX) > 20) {
                        wheelLock = true;
                        if (e.deltaY > 0 || e.deltaX > 0) next();
                        else prev();
                        setTimeout(() => { wheelLock = false; }, 260);
                    }
                }, { passive: false });

                // 键盘左右键支持
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight') next();
                    if (e.key === 'ArrowLeft') prev();
                });
            }

            // 01. AnyChem: 旋转 3D 分子模型投影 (单色高科技质感，严格与卡牌主题色 #9fb48d 保持一致)
            function initAnychemMoleculeSimulation() {
                const canvas = document.getElementById('anychem-mol-canvas');
                if (!canvas) return null;
                const ctx = canvas.getContext('2d');
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = 660 * dpr;
                canvas.height = 372 * dpr;
                ctx.scale(dpr, dpr);

                // 3D 苯环与共振结构模型 (Benzene C₆H₆: 6 个碳原子 + 6 个氢原子 + 离域大Π键环)
                const rc = 64;  // 碳环半径
                const rh = 106; // 氢原子半径
                const carbons = [];
                const hydrogens = [];
                for (let i = 0; i < 6; i++) {
                    const ang = (i * Math.PI) / 3;
                    carbons.push({ x: rc * Math.cos(ang), y: rc * Math.sin(ang), z: 0 });
                    hydrogens.push({ x: rh * Math.cos(ang), y: rh * Math.sin(ang), z: 0 });
                }

                return function render(time) {
                    ctx.clearRect(0, 0, 660, 372);
                    const cx = 465;
                    const cy = 186;

                    // 空间 3D 自转 (Yaw / Pitch / Roll)
                    const rotY = time * 0.00075;
                    const rotX = 0.42 + Math.sin(time * 0.0005) * 0.22;
                    const rotZ = time * 0.00035;

                    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
                    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
                    const cosZ = Math.cos(rotZ), sinZ = Math.sin(rotZ);

                    function project(p) {
                        const x1 = p.x * cosZ - p.y * sinZ;
                        const y1 = p.x * sinZ + p.y * cosZ;
                        const z1 = p.z;

                        const x2 = x1 * cosY + z1 * sinY;
                        const z2 = -x1 * sinY + z1 * cosY;

                        const y3 = y1 * cosX - z2 * sinX;
                        const z3 = y1 * sinX + z2 * cosX;

                        const fov = 380;
                        const scale = fov / (fov - z3);
                        return {
                            sx: cx + x2 * scale,
                            sy: cy + y3 * scale,
                            sz: z3,
                            scale
                        };
                    }

                    const projC = carbons.map(project);
                    const projH = hydrogens.map(project);

                    // 绘制上下离域电子云环 (大Π键共振虚线投影)
                    [-20, 20].forEach(offsetZ => {
                        ctx.save();
                        ctx.beginPath();
                        const segments = 24;
                        for (let j = 0; j <= segments; j++) {
                            const a = (j * Math.PI * 2) / segments;
                            const pt = project({ x: rc * Math.cos(a), y: rc * Math.sin(a), z: offsetZ });
                            if (j === 0) ctx.moveTo(pt.sx, pt.sy);
                            else ctx.lineTo(pt.sx, pt.sy);
                        }
                        ctx.setLineDash([4, 4]);
                        ctx.strokeStyle = 'rgba(159, 180, 141, 0.16)';
                        ctx.lineWidth = 1.2;
                        ctx.stroke();
                        ctx.restore();
                    });

                    // 收集共价键并按深度排序绘制
                    const edges = [];
                    for (let i = 0; i < 6; i++) {
                        const next = (i + 1) % 6;
                        edges.push({
                            type: 'cc',
                            order: (i % 2 === 0) ? 2 : 1,
                            p1: projC[i],
                            p2: projC[next],
                            avgZ: (projC[i].sz + projC[next].sz) * 0.5
                        });
                    }
                    for (let i = 0; i < 6; i++) {
                        edges.push({
                            type: 'ch',
                            order: 1,
                            p1: projC[i],
                            p2: projH[i],
                            avgZ: (projC[i].sz + projH[i].sz) * 0.5
                        });
                    }

                    edges.sort((a, b) => a.avgZ - b.avgZ);

                    edges.forEach(edge => {
                        const { p1, p2, order, type, avgZ } = edge;
                        const alpha = Math.max(0.12, Math.min(0.55, 0.28 + (avgZ / 120) * 0.25));
                        ctx.save();
                        ctx.lineCap = 'round';

                        if (type === 'cc') {
                            if (order === 2) {
                                const dx = p2.sx - p1.sx;
                                const dy = p2.sy - p1.sy;
                                const len = Math.hypot(dx, dy) || 1;
                                const nx = (-dy / len) * 3.2;
                                const ny = (dx / len) * 3.2;

                                ctx.strokeStyle = `rgba(159, 180, 141, ${alpha})`;
                                ctx.lineWidth = 1.6;
                                ctx.beginPath();
                                ctx.moveTo(p1.sx + nx, p1.sy + ny);
                                ctx.lineTo(p2.sx + nx, p2.sy + ny);
                                ctx.moveTo(p1.sx - nx, p1.sy - ny);
                                ctx.lineTo(p2.sx - nx, p2.sy - ny);
                                ctx.stroke();
                            } else {
                                ctx.strokeStyle = `rgba(159, 180, 141, ${alpha})`;
                                ctx.lineWidth = 1.6;
                                ctx.beginPath();
                                ctx.moveTo(p1.sx, p1.sy);
                                ctx.lineTo(p2.sx, p2.sy);
                                ctx.stroke();
                            }
                        } else {
                            ctx.strokeStyle = `rgba(159, 180, 141, ${alpha * 0.75})`;
                            ctx.lineWidth = 1.2;
                            ctx.beginPath();
                            ctx.moveTo(p1.sx, p1.sy);
                            ctx.lineTo(p2.sx, p2.sy);
                            ctx.stroke();
                        }
                        ctx.restore();
                    });

                    // 收集原子并按深度绘制 (颜色单一和卡牌一致: #9fb48d)
                    const atoms = [];
                    projC.forEach(p => atoms.push({ type: 'C', p }));
                    projH.forEach(p => atoms.push({ type: 'H', p }));
                    atoms.sort((a, b) => a.p.sz - b.p.sz);

                    atoms.forEach(atom => {
                        const { type, p } = atom;
                        const alpha = Math.max(0.2, Math.min(0.9, 0.5 + (p.sz / 120) * 0.35));
                        const r = (type === 'C' ? 4.8 : 2.8) * p.scale;

                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(159, 180, 141, ${alpha})`;
                        if (type === 'C') {
                            ctx.shadowColor = 'rgba(159, 180, 141, 0.45)';
                            ctx.shadowBlur = 8 * p.scale;
                        }
                        ctx.fill();
                        ctx.restore();
                    });
                };
            }

            // 03. Chemiation: 3D 反应机理结构式仿真 (经典伪 3D 字母排印与化学键模型)
            function initChemiationStructureSimulation() {
                const canvas = document.getElementById('chemiation-struct-canvas');
                if (!canvas) return null;
                const ctx = canvas.getContext('2d');
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = 660 * dpr;
                canvas.height = 372 * dpr;
                ctx.scale(dpr, dpr);

                // Chemiation 经典乙酸/反应活性中间体拓扑坐标
                const rawAtoms = [
                    { id: 'C1', el: 'C', x: -68, y: -18, z: 12 },
                    { id: 'H1', el: 'H', x: -108, y: -10, z: 32 },
                    { id: 'H2', el: 'H', x: -62, y: -68, z: 14 },
                    { id: 'H3', el: 'H', x: -75, y: -12, z: -32 },
                    { id: 'C2', el: 'C', x: 2, y: 14, z: 0 },
                    { id: 'O1', el: 'O', x: 12, y: 72, z: -16, isCarbonyl: true },
                    { id: 'O2', el: 'O', x: 58, y: -26, z: 14 },
                    { id: 'H4', el: 'H', x: 96, y: -18, z: 10 },
                    { id: 'C3', el: 'C', x: 76, y: 36, z: -10 },
                    { id: 'H5', el: 'H', x: 74, y: 80, z: -26 },
                    { id: 'C4', el: 'C', x: 128, y: 16, z: 16 },
                    { id: 'H6', el: 'H', x: 166, y: 34, z: 12 },
                    { id: 'H7', el: 'H', x: 124, y: -30, z: 34 }
                ];

                const rawBonds = [
                    { a1: 0, a2: 1, order: 1 },
                    { a1: 0, a2: 2, order: 1 },
                    { a1: 0, a2: 3, order: 1 },
                    { a1: 0, a2: 4, order: 1 },
                    { a1: 4, a2: 5, order: 2 },
                    { a1: 4, a2: 6, order: 1 },
                    { a1: 6, a2: 7, order: 1 },
                    { a1: 4, a2: 8, order: 1 },
                    { a1: 8, a2: 9, order: 1 },
                    { a1: 8, a2: 10, order: 1 },
                    { a1: 10, a2: 11, order: 1 },
                    { a1: 10, a2: 12, order: 1 }
                ];

                return function render(time) {
                    ctx.clearRect(0, 0, 660, 372);
                    const cx = 475;
                    const cy = 186;

                    // 空间伪 3D 慢速平滑自转
                    const rotY = time * 0.00065;
                    const rotX = 0.35 + Math.sin(time * 0.00045) * 0.18;
                    const rotZ = -0.12 + Math.cos(time * 0.00035) * 0.08;

                    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
                    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
                    const cosZ = Math.cos(rotZ), sinZ = Math.sin(rotZ);

                    let minZ = Infinity, maxZ = -Infinity;
                    const projectedAtoms = rawAtoms.map(atom => {
                        const x1 = atom.x * cosZ - atom.y * sinZ;
                        const y1 = atom.x * sinZ + atom.y * cosZ;
                        const z1 = atom.z;

                        const x2 = x1 * cosY + z1 * sinY;
                        const z2 = -x1 * sinY + z1 * cosY;

                        const y3 = y1 * cosX - z2 * sinX;
                        const z3 = y1 * sinX + z2 * cosX;

                        if (z3 < minZ) minZ = z3;
                        if (z3 > maxZ) maxZ = z3;

                        const fov = 380;
                        const scale = fov / (fov - z3);
                        return {
                            ...atom,
                            sx: cx + x2 * scale,
                            sy: cy + y3 * scale,
                            sz: z3,
                            scale
                        };
                    });

                    const zRange = Math.max(1, maxZ - minZ);
                    projectedAtoms.forEach(atom => {
                        atom.depth = (atom.sz - minZ) / zRange;
                        atom.fontSize = Math.round(15 + atom.depth * 13);
                        atom.clipRadius = atom.fontSize * 0.46;
                    });

                    const renderBonds = rawBonds.map(b => {
                        const a1 = projectedAtoms[b.a1];
                        const a2 = projectedAtoms[b.a2];
                        return {
                            ...b,
                            a1,
                            a2,
                            avgZ: (a1.sz + a2.sz) * 0.5,
                            avgDepth: (a1.depth + a2.depth) * 0.5
                        };
                    });

                    const queue = [];
                    renderBonds.forEach(b => queue.push({ type: 'bond', z: b.avgZ, data: b }));
                    projectedAtoms.forEach(a => queue.push({ type: 'atom', z: a.sz, data: a }));
                    queue.sort((a, b) => a.z - b.z);

                    queue.forEach(item => {
                        if (item.type === 'bond') {
                            const b = item.data;
                            const { a1, a2, order, avgDepth } = b;
                            const dx = a2.sx - a1.sx;
                            const dy = a2.sy - a1.sy;
                            const dist = Math.hypot(dx, dy) || 1;
                            const ux = dx / dist;
                            const uy = dy / dist;

                            // 严格自字母边缘出线，绝不侵入字形
                            const startX = a1.sx + ux * a1.clipRadius;
                            const startY = a1.sy + uy * a1.clipRadius;
                            const endX = a2.sx - ux * a2.clipRadius;
                            const endY = a2.sy - uy * a2.clipRadius;

                            if (Math.hypot(endX - startX, endY - startY) < 2) return;

                            const nx = -uy;
                            const ny = ux;
                            const alpha = 0.22 + avgDepth * 0.55;
                            const lineWidth = 1.3 + avgDepth * 1.5;

                            ctx.save();
                            ctx.lineCap = 'round';
                            ctx.strokeStyle = `rgba(192, 138, 62, ${alpha})`;
                            ctx.lineWidth = lineWidth;

                            if (order === 2) {
                                const offset = 3.2;
                                ctx.beginPath();
                                ctx.moveTo(startX + nx * offset, startY + ny * offset);
                                ctx.lineTo(endX + nx * offset, endY + ny * offset);
                                ctx.moveTo(startX - nx * offset, startY - ny * offset);
                                ctx.lineTo(endX - nx * offset, endY - ny * offset);
                                ctx.stroke();
                            } else {
                                ctx.beginPath();
                                ctx.moveTo(startX, startY);
                                ctx.lineTo(endX, endY);
                                ctx.stroke();
                            }
                            ctx.restore();
                        } else {
                            const a = item.data;
                            const { el, sx, sy, fontSize, depth, isCarbonyl } = a;

                            ctx.save();
                            ctx.font = `bold ${fontSize}px "Century Gothic", "Cinzel", "Times New Roman", serif`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';

                            // 底色外描边：清除身后化学键交叉干扰
                            ctx.lineWidth = fontSize * 0.32;
                            ctx.lineJoin = 'round';
                            ctx.strokeStyle = '#1c0d06';
                            ctx.strokeText(el, sx, sy);

                            if (isCarbonyl) {
                                ctx.fillStyle = `rgba(184, 74, 40, ${0.45 + depth * 0.55})`;
                                ctx.shadowColor = 'rgba(184, 74, 40, 0.6)';
                                ctx.shadowBlur = 10 * depth;
                            } else {
                                const r = Math.round(168 + (245 - 168) * depth);
                                const g = Math.round(142 + (235 - 142) * depth);
                                const b = Math.round(122 + (215 - 122) * depth);
                                const alpha = 0.35 + depth * 0.6;
                                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                            }

                            ctx.fillText(el, sx, sy);
                            ctx.restore();
                        }
                    });
                };
            }

            function renderLoop() {
                // 丝滑逼近目标位置
                currentPos += (targetPos - currentPos) * 0.12;
                curTiltX += (mouseTiltX - curTiltX) * 0.08;
                curTiltY += (mouseTiltY - curTiltY) * 0.08;

                const isMobile = window.innerWidth < 768;
                const spacing = isMobile ? 240 : 390;
                const depthZ = isMobile ? 160 : 250;

                // 防止整数偏移量无上限累加，静止且偏移极大时平滑移位
                if (!isPointerDown && Math.abs(targetPos) > 100 && Math.abs(targetPos - currentPos) < 0.01) {
                    const shifts = Math.floor(targetPos / total) * total;
                    targetPos -= shifts;
                    currentPos -= shifts;
                }

                cardElements.forEach((card, i) => {
                    // 环形最短拓扑距离计算：把当前卡片投影至 [-total/2, total/2] 扇区
                    let offset = ((i - currentPos) % total + total) % total;
                    if (offset > total / 2) {
                        offset -= total;
                    }
                    const absOffset = Math.abs(offset);

                    // 空间 3D 几何变换
                    const tx = offset * spacing;
                    const tz = -absOffset * depthZ;
                    const ry = -offset * (isMobile ? 18 : 28) + (absOffset < 0.5 ? curTiltY : 0);
                    const rx = absOffset < 0.5 ? curTiltX : 0;
                    const scale = 1 - Math.min(absOffset * 0.14, 0.45);
                    
                    // 当卡片转至侧后方时渐隐，杜绝在背面翻折时产生穿帮跳动
                    let opacity = 0;
                    if (absOffset < 2.6) {
                        opacity = Math.max(0, 1 - absOffset * 0.38);
                    }
                    const blur = Math.max(0, (absOffset - 0.25) * 3);

                    card.style.transform = `translate3d(${tx.toFixed(1)}px, 0, ${tz.toFixed(1)}px) rotateY(${ry.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
                    card.style.opacity = opacity.toFixed(3);
                    card.style.filter = blur > 0.1 ? `blur(${blur.toFixed(1)}px)` : 'none';
                    card.style.zIndex = Math.round(20 - absOffset * 4);
                    card.style.visibility = opacity <= 0.01 ? 'hidden' : 'visible';
                });

                // 渲染 AnyChem 与 Chemiation 卡片 3D 分子动态模型与结构式
                const animTime = performance.now();
                if (renderAnychemMol) renderAnychemMol(animTime);
                if (renderChemiationStruct) renderChemiationStruct(animTime);

                requestAnimationFrame(renderLoop);
            }

            return {
                init,
                next,
                prev,
                goTo
            };
        })();

        if (DeckEngine) {
            DeckEngine.init();
        }

        /* 3. 散落狂草笔画随滚动吸附重新汇聚算法 + 往下滑平滑无级过渡至淡黄色宣纸 (#FAF6E9) */
        (function initScrollConvergenceAndColorMorph() {
            const section = document.getElementById('fantasycitySection');
            const chars = document.querySelectorAll('.ink-char-piece');
            const enLetters = document.querySelectorAll('.ink-en-letter');
            const navBrand = document.getElementById('navBrand');
            const navGithub = document.getElementById('navGithub');

            if (!section) return;

            function onScroll() {
                const vh = window.innerHeight;
                const scrollY = window.scrollY;

                // 随着向下滑动，提示逐渐淡出

                    const hintOpacity = Math.max(0, 1 - scrollY / 90);

                }

                // -------------------------------------------------------------
                // 界面交接平滑解算：保持首屏 100% 深邃纯黑，向下滑动时平滑无级过渡至淡黄色宣纸 (#FAF6E9)
                // -------------------------------------------------------------
                const morphStart = vh * 0.28; // 首屏 28% 滚程内纯净星空深黑，保护 3D 展台
                const morphEnd = vh * 1.05;   // 接近整屏滚动时完成宣纸色彩升华
                let morphProgress = 0;
                if (scrollY > morphStart) {
                    morphProgress = Math.min(1, (scrollY - morphStart) / (morphEnd - morphStart));
                }

                // 采用 smoothstep 缓动，起承转合自然天成，杜绝任何生硬切断
                const easeMorph = morphProgress * morphProgress * (3 - 2 * morphProgress);

                // 背景色：由深邃星空 rgb(3, 6, 17) 平滑无级过渡至 东方淡黄色宣纸 rgb(250, 246, 233) [#FAF6E9]
                const bgR = Math.round(3 + (250 - 3) * easeMorph);
                const bgG = Math.round(6 + (246 - 6) * easeMorph);
                const bgB = Math.round(17 + (233 - 17) * easeMorph);
                document.body.style.backgroundColor = `rgb(${bgR}, ${bgG}, ${bgB})`;

                // 顶栏文字与图标颜色：从白色过渡至古木深墨色 rgb(36, 20, 11) [#24140b]，确保在淡黄底上清晰
                if (navBrand && navGithub) {
                    const textR = Math.round(255 + (36 - 255) * easeMorph);
                    const textG = Math.round(255 + (20 - 255) * easeMorph);
                    const textB = Math.round(255 + (11 - 255) * easeMorph);
                    const textColor = `rgb(${textR}, ${textG}, ${textB})`;
                    navBrand.style.color = textColor;
                    navGithub.style.color = textColor;
                }

                // 星空淡出与水墨流体淡入
                if (cosmosCanvas) {
                    cosmosCanvas.style.opacity = (0.92 * (1 - easeMorph * 0.95)).toFixed(3);
                }
                if (inkFluidCanvas) {
                    inkFluidCanvas.style.opacity = (0.35 * easeMorph).toFixed(3);
                }

                // 一句话世界观介绍颜色：由浅色平滑过渡为深咖啡墨色
                if (summaryLine) {
                    const smR = Math.round(226 + (56 - 226) * easeMorph);
                    const smG = Math.round(232 + (34 - 232) * easeMorph);
                    const smB = Math.round(240 + (21 - 240) * easeMorph);
                    summaryLine.style.color = `rgb(${smR}, ${smG}, ${smB})`;
                }

                // 右侧专属长圆柱胶囊主题自适应：星空下为冷灰透明蓝胶囊，滑动到宣纸时自适应为古风松烟焦墨胶囊与朱砂光晕
                const scrollbarThumbColor = easeMorph > 0.38
                    ? `rgba(36, 20, 11, ${(0.44 + 0.28 * easeMorph).toFixed(2)})`
                    : `rgba(148, 163, 184, ${(0.50 - 0.12 * easeMorph).toFixed(2)})`;
                const scrollbarHoverColor = easeMorph > 0.38 ? '#be123c' : '#38bdf8';
                const scrollbarGlowColor = easeMorph > 0.38 ? 'rgba(190, 18, 60, 0.45)' : 'rgba(56, 189, 248, 0.55)';
                document.documentElement.style.setProperty('--custom-scroll-color', scrollbarThumbColor);
                document.documentElement.style.setProperty('--custom-scroll-hover', scrollbarHoverColor);
                document.documentElement.style.setProperty('--custom-scroll-glow', scrollbarGlowColor);

                // -------------------------------------------------------------
                // 狂草书法大字三维吸附重聚与视口入场感知解算
                // -------------------------------------------------------------
                const rect = section.getBoundingClientRect();
                const gateway = document.querySelector('.fc-organic-gateway');
                const gRect = gateway ? gateway.getBoundingClientRect() : rect;

                const startY = vh * 0.92;
                const endY = vh * 0.30;
                const rawProgress = (startY - rect.top) / (startY - endY);
                const progress = Math.max(0, Math.min(1, rawProgress));

                // 纯净单向连贯触发：滑入幻想城后保持激活，滑回首屏顶端才复位，彻底根除反复触发与动画断层
                if (scrollY < vh * 0.18) {
                    section.classList.remove('fc-entered');

                    section.classList.add('fc-entered');
                }
                const isConverged = progress > 0.88;
                section.classList.toggle('fc-converged', isConverged);

                const ease = 1 - Math.pow(1 - progress, 2.6);
                const unEase = 1 - ease;

                // 中文大字三维散开 -> 聚拢汇聚 (聚拢时颜色从浅白色转为苍劲焦墨黑 rgb(22, 17, 14))
                const charR = Math.round(255 + (22 - 255) * ease);
                const charG = Math.round(255 + (17 - 255) * ease);
                const charB = Math.round(255 + (14 - 255) * ease);
                const charColor = `rgb(${charR}, ${charG}, ${charB})`;

                chars.forEach(char => {
                    const x = parseFloat(char.getAttribute('data-x')) * unEase;
                    const y = parseFloat(char.getAttribute('data-y')) * unEase;
                    const z = parseFloat(char.getAttribute('data-z')) * unEase;
                    const rot = parseFloat(char.getAttribute('data-rot')) * unEase;
                    const blur = unEase * 12;
                    const opacity = 0.2 + 0.8 * ease;

                    char.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotate(${rot}deg)`;
                    char.style.filter = blur > 0.2 ? `blur(${blur}px)` : 'none';
                    char.style.opacity = opacity;
                    char.style.color = charColor;
                });

                // 英文字母散开 -> 聚拢
                const enR = Math.round(255 + (166 - 255) * ease);
                const enG = Math.round(255 + (124 - 255) * ease);
                const enB = Math.round(255 + (30 - 255) * ease);
                const enColor = `rgb(${enR}, ${enG}, ${enB})`;

                enLetters.forEach(en => {
                    const x = parseFloat(en.getAttribute('data-x')) * unEase;
                    const y = parseFloat(en.getAttribute('data-y')) * unEase;
                    const blur = unEase * 8;
                    en.style.transform = `translate3d(${x}px, ${y}px, 0)`;
                    en.style.filter = blur > 0.2 ? `blur(${blur}px)` : 'none';
                    en.style.opacity = 0.2 + 0.8 * ease;
                    en.style.color = enColor;
                });
            }

            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
        })();

        /* 4. 星空粒子 Canvas */
        const CosmosEngine = (function() {
            const canvas = document.getElementById('cosmos-canvas');
            if (!canvas) return null;
            const ctx = canvas.getContext('2d');
            let w, h;
            const stars = [];
            const count = 180;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 1.6 + 0.3,
                    alpha: Math.random() * 0.8 + 0.2,
                    speed: Math.random() * 0.25 + 0.05,
                    pulse: Math.random() * Math.PI * 2
                });
            }

            let mouseX = 0, mouseY = 0;
            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - w / 2) * 0.04;
                mouseY = (e.clientY - h / 2) * 0.04;
            });

            function render(time) {
                ctx.clearRect(0, 0, w, h);
                const t = time * 0.002;

                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    s.y -= s.speed;
                    if (s.y < 0) s.y = h;

                    const drawX = s.x - mouseX * (s.size * 0.4);
                    const drawY = s.y - mouseY * (s.size * 0.4);
                    const twinkle = Math.sin(t + s.pulse) * 0.35 + 0.65;
                    const finalAlpha = s.alpha * twinkle;

                    ctx.fillStyle = `rgba(219, 234, 254, ${finalAlpha})`;

                    ctx.beginPath();
                    ctx.arc(drawX, drawY, s.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        })();

        /* 5. 幻想城水墨流体 Canvas (在淡黄色宣纸上晕染深黑墨云) */
        (function initInkFluid() {

            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w, h;
            const puffs = [];
            const count = 35;

            function resize() {
                w = canvas.width = canvas.parentElement.clientWidth;
                h = canvas.height = canvas.parentElement.clientHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < count; i++) {
                puffs.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 90 + 50,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.2,
                    alpha: Math.random() * 0.28 + 0.08
                });
            }

            function drawInk() {
                ctx.clearRect(0, 0, w, h);
                for (let i = 0; i < puffs.length; i++) {
                    const p = puffs[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < -p.r) p.x = w + p.r;
                    if (p.x > w + p.r) p.x = -p.r;
                    if (p.y < -p.r) p.y = h + p.r;
                    if (p.y > h + p.r) p.y = -p.r;

                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
                    grad.addColorStop(0, `rgba(192, 57, 43, ${p.alpha * 0.25})`);
                    grad.addColorStop(0.4, `rgba(36, 20, 11, ${p.alpha * 0.55})`);
                    grad.addColorStop(1, 'transparent');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                requestAnimationFrame(drawInk);
            }
            drawInk();
        })();
